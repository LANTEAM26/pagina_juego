<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍪 La Fábrica de Letras 🏭</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Fredoka', sans-serif;
            --box-upper: #0984e3;
            --box-lower: #00b894;
            --box-trash: #e74c3c;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #74b9ff 0%, #ffeaa7 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            color: #d63031;
            margin: 5px 0;
            font-size: 36px;
            text-shadow: 2px 2px 0px #fff, 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* CONTROLES SUPERIORES (Modos y Toggle) */
        .controls-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn, .toggle-btn {
            background: #fff;
            border: 3px solid #0984e3;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #0984e3;
            cursor: pointer;
            box-shadow: 0 4px 0 #0984e3;
            transition: all 0.1s;
            font-family: var(--font-main);
        }
        .mode-btn.active, .toggle-btn.active {
            background: #0984e3;
            color: #fff;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #05508c;
        }
        .toggle-btn {
            border-color: #e67e22;
            color: #d35400;
            box-shadow: 0 4px 0 #d35400;
        }
        .toggle-btn.active {
            background: #e67e22;
            color: #fff;
            box-shadow: 0 2px 0 #b9770e;
        }

        .status-bar {
            display: flex;
            gap: 25px;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 18px;
            color: #2d3436;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            margin-bottom: 10px;
            border: 3px solid #ff7675;
            font-weight: 700;
        }

        /* BOTÓN DE SONIDO (IZQUIERDA) */
        .sound-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: #fff;
            border: 4px solid #0984e3;
            border-radius: 50%;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #05508c;
            z-index: 50;
            transition: transform 0.1s;
        }
        .sound-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #05508c; }

        /* ESCENARIO DE LA FÁBRICA ANCHO */
        .factory-area {
            position: relative;
            width: 92vw;
            max-width: 1100px;
            height: 420px;
            background: linear-gradient(180deg, #74b9ff 0%, #0984e3 100%);
            border-radius: 25px;
            border: 6px solid #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* CINTA TRANSPORTADORA CONTINUA */
        .conveyor-belt {
            position: absolute;
            top: 190px;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #2d3436;
            border-top: 6px solid #1e272c;
            border-bottom: 6px solid #1e272c;
            background-image: linear-gradient(90deg, rgba(255,255,255,0.08) 50%, rgba(0,0,0,0.25) 50%);
            background-size: 60px 100px;
            animation: moveBelt 2s linear infinite;
            z-index: 5;
        }

        .conveyor-belt.fast { animation-duration: 1s; }

        @keyframes moveBelt {
            0% { background-position: 0 0; }
            100% { background-position: 60px 0; }
        }

        /* CAJAS DE CLASIFICACIÓN */
        .boxes-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 15px 25px;
            z-index: 10;
        }

        .factory-box {
            width: 210px;
            height: 110px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #fff;
            box-shadow: 0 8px 0 rgba(0,0,0,0.25);
            font-size: 19px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            position: relative;
        }

        .box-upper { background: var(--box-upper); box-shadow: 0 8px 0 #05508c; }
        .box-lower { background: var(--box-lower); box-shadow: 0 8px 0 #006248; }
        .box-trash { background: var(--box-trash); box-shadow: 0 8px 0 #962d22; width: 170px; height: 100px; font-size: 17px; display: none; }
        .box-trash.active-trash { display: flex; }

        .factory-box span { font-size: 32px; margin-top: 4px; }
        .box-trash span { font-size: 30px; }

        /* GALLETA / FIGURA */
        .cookie {
            position: absolute;
            top: 185px;
            width: 85px;
            height: 85px;
            background: #fdcb6e;
            border: 4px solid #f1c40f;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
            color: #d35400;
            box-shadow: 0 8px 0 #e17055, inset 0 5px 10px rgba(255,255,255,0.6);
            cursor: grab;
            z-index: 20;
            font-family: 'Nunito', sans-serif;
            transition: transform 0.1s;
        }
        .cookie.shape {
            background: #a29bfe;
            border-color: #6c5ce7;
            box-shadow: 0 8px 0 #4834d4, inset 0 5px 10px rgba(255,255,255,0.6);
            border-radius: 50%;
            color: #fff;
        }
        .cookie:active { cursor: grabbing; }

        /* MODAL DE VICTORIA */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center;
            z-index: 100; visibility: hidden; opacity: 0; transition: all 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff; padding: 35px; border-radius: 30px; text-align: center;
            max-width: 85%; transform: scale(0.7); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 6px solid #0984e3;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 32px; margin-bottom: 10px; color: #0984e3; }
        .modal-btn {
            background: #00b894; border: none; padding: 12px 30px;
            font-size: 20px; color: white; border-radius: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #006248; margin-top: 15px;
            font-family: var(--font-main);
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: none; }

        .sparkle {
            position: absolute; font-size: 35px; pointer-events: none; z-index: 100;
            animation: popOut 0.6s ease-out forwards;
        }
        @keyframes popOut {
            0% { transform: scale(0) translate(0, 0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c3683a3d.mp3?filename=fun-life-112588.mp3" type="audio/mpeg">
    </audio>

    <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</div>

    <h1>🍪 La Fábrica de Letras 🏭</h1>

    <div class="controls-panel">
        <button id="mode-chill" class="mode-btn active" onclick="setGameMode('chill')">🧸 Modo Tranquilo</button>
        <button id="mode-fast" class="mode-btn" onclick="setGameMode('fast')">⚡ Fábrica Rápida</button>
        <button id="toggle-shapes" class="toggle-btn active" onclick="toggleShapesMode()">✨ Con Figuras (Trash)</button>
    </div>
    
    <div class="status-bar">
        <div>Galletas Empaquetadas: <span id="score">0</span> / 10</div>
    </div>

    <div class="factory-area" id="factoryArea">
        <div class="boxes-container">
            <div class="factory-box box-upper" id="boxUpper">
                MAYÚSCULAS
                <span id="upper-sample">A</span>
            </div>
            
            <div class="factory-box box-trash active-trash" id="boxTrash">
                BASURA
                <span>🗑️</span>
            </div>

            <div class="factory-box box-lower" id="boxLower">
                minúsculas
                <span id="lower-sample">a</span>
            </div>
        </div>

        <div class="conveyor-belt" id="conveyorBelt"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="m-title">¡Excelente Trabajo! 🎉</h2>
            <p style="font-size: 18px; color: #555; font-weight: bold;" id="m-msg">¡Empaquetaste todas las galletas correctamente!</p>
            <button class="modal-btn" onclick="restartGame()">Jugar de Nuevo ➔</button>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, soundEnabled = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function sfxPickup() { playTone(400, 'sine', 0.1, 0.1); }
        function sfxCorrect() { playTone(587.33, 'triangle', 0.2, 0.15); setTimeout(() => playTone(880, 'triangle', 0.3, 0.15), 100); }
        function sfxTrash() { playTone(180, 'sawtooth', 0.2, 0.2); }
        function sfxWrong() { playTone(150, 'sine', 0.3, 0.2); }
        function sfxVictory() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.3, 0.05), i * 150)); }

        function toggleSound() {
            initAudio();
            const bgm = document.getElementById('bgm');
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                document.getElementById('soundBtn').innerText = '🔊';
                bgm.volume = 0.2; bgm.play().catch(e => {});
            } else {
                document.getElementById('soundBtn').innerText = '🔇';
                bgm.pause();
            }
        }

        const letterPairs = [
            { upper: 'A', lower: 'a' }, { upper: 'B', lower: 'b' }, { upper: 'C', lower: 'c' },
            { upper: 'D', lower: 'd' }, { upper: 'E', lower: 'e' }, { upper: 'F', lower: 'f' },
            { upper: 'G', lower: 'g' }, { upper: 'M', lower: 'm' }, { upper: 'P', lower: 'p' },
            { upper: 'S', lower: 's' }
        ];

        const shapesList = ['⭐', '⬛', '🟢', '🔺', '🔷', '⬡'];

        let score = 0;
        let gameMode = 'chill'; 
        let useShapes = true;
        let currentCookie = null;

        const factoryArea = document.getElementById('factoryArea');
        const conveyorBelt = document.getElementById('conveyorBelt');
        const boxTrash = document.getElementById('boxTrash');

        function setGameMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode === 'chill' ? 'mode-chill' : 'mode-fast').classList.add('active');
            
            if (mode === 'fast') {
                conveyorBelt.classList.add('fast');
            } else {
                conveyorBelt.classList.remove('fast');
            }
            restartGame();
        }

        function toggleShapesMode() {
            useShapes = !useShapes;
            const btn = document.getElementById('toggle-shapes');
            if (useShapes) {
                btn.classList.add('active');
                btn.innerText = '✨ Con Figuras (Trash)';
                boxTrash.classList.add('active-trash');
            } else {
                btn.classList.remove('active');
                btn.innerText = '🔤 Solo Letras';
                boxTrash.classList.remove('active-trash');
            }
            restartGame();
        }

        function spawnCookie() {
            if (score >= 10 || currentCookie) return;

            currentCookie = document.createElement('div');
            currentCookie.className = 'cookie';

            let isShape = useShapes && (Math.random() < 0.3);
            if (isShape) {
                let randomShape = shapesList[Math.floor(Math.random() * shapesList.length)];
                currentCookie.innerText = randomShape;
                currentCookie.dataset.type = 'shape';
                currentCookie.classList.add('shape');
            } else {
                let pair = letterPairs[Math.floor(Math.random() * letterPairs.length)];
                let isUpper = Math.random() < 0.5;
                currentCookie.innerText = isUpper ? pair.upper : pair.lower;
                currentCookie.dataset.type = isUpper ? 'upper' : 'lower';
            }

            currentCookie.style.left = '20px';
            currentCookie.style.top = '185px'; // Posición exacta en la línea de la cinta
            factoryArea.appendChild(currentCookie);

            makeDraggable(currentCookie);

            let pos = 20;
            let speed = gameMode === 'fast' ? 2.3 : 1.1;

            function move() {
                if (!currentCookie || currentCookie.dataset.dragging === 'true') return;
                pos += speed;
                currentCookie.style.left = pos + 'px';

                if (pos > factoryArea.offsetWidth - 100) {
                    currentCookie.remove();
                    currentCookie = null;
                    setTimeout(spawnCookie, 800);
                    return;
                }
                currentCookie.animFrame = requestAnimationFrame(move);
            }
            currentCookie.animFrame = requestAnimationFrame(move);
        }

        function createSparkles(x, y) {
            for(let i=0; i<6; i++) {
                let spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.innerText = ['✨', '🍪', '⭐'][Math.floor(Math.random()*3)];
                spark.style.left = x + 'px'; spark.style.top = y + 'px';
                spark.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                spark.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function makeDraggable(elm) {
            let posX = 0, posY = 0, startLeft = 0, startTop = 0;

            elm.onmousedown = dragStart;
            elm.ontouchstart = dragStart;

            function dragStart(e) {
                initAudio();
                sfxPickup();
                e.preventDefault();
                cancelAnimationFrame(elm.animFrame);
                elm.dataset.dragging = 'true';

                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;

                startLeft = elm.offsetLeft;
                startTop = elm.offsetTop;
                posX = clientX; posY = clientY;

                document.onmousemove = dragMove; document.ontouchmove = dragMove;
                document.onmouseup = dragEnd; document.ontouchend = dragEnd;
            }

            function dragMove(e) {
                e.preventDefault();
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;
                elm.style.left = (startLeft + (clientX - posX)) + 'px';
                elm.style.top = (startTop + (clientY - posY)) + 'px';
            }

            function dragEnd() {
                document.onmousemove = null; document.ontouchmove = null;
                document.onmouseup = null; document.ontouchend = null;
                elm.dataset.dragging = 'false';

                let cookieRect = elm.getBoundingClientRect();
                let upperRect = document.getElementById('boxUpper').getBoundingClientRect();
                let lowerRect = document.getElementById('boxLower').getBoundingClientRect();
                let trashRect = boxTrash.getBoundingClientRect();

                let droppedInBox = false;

                if (cookieRect.left < upperRect.right && cookieRect.right > upperRect.left &&
                    cookieRect.top < upperRect.bottom && cookieRect.bottom > upperRect.top) {
                    if (elm.dataset.type === 'upper') {
                        correctDrop(upperRect, true);
                        droppedInBox = true;
                    }
                }
                else if (cookieRect.left < lowerRect.right && cookieRect.right > lowerRect.left &&
                           cookieRect.top < lowerRect.bottom && cookieRect.bottom > lowerRect.top) {
                    if (elm.dataset.type === 'lower') {
                        correctDrop(lowerRect, true);
                        droppedInBox = true;
                    }
                }
                else if (useShapes && boxTrash.classList.contains('active-trash') &&
                           cookieRect.left < trashRect.right && cookieRect.right > trashRect.left &&
                           cookieRect.top < trashRect.bottom && cookieRect.bottom > trashRect.top) {
                    if (elm.dataset.type === 'shape') {
                        correctDrop(trashRect, false);
                        droppedInBox = true;
                    }
                }

                // SI SE DEJA EN UNA ZONA NO VÁLIDA: HACE SNAP AUTOMÁTICO A LA LÍNEA DE LA CINTA
                if (!droppedInBox) {
                    sfxWrong();
                    elm.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    elm.style.top = '185px'; // Regresa directo a la altura de la cinta
                    
                    setTimeout(() => {
                        elm.style.transition = 'none';
                        let pos = elm.offsetLeft;
                        let speed = gameMode === 'fast' ? 2.3 : 1.1;
                        function resumeMove() {
                            if (!elm || elm.dataset.dragging === 'true') return;
                            pos += speed; elm.style.left = pos + 'px';
                            if (pos > factoryArea.offsetWidth - 100) { elm.remove(); currentCookie = null; setTimeout(spawnCookie, 800); return; }
                            elm.animFrame = requestAnimationFrame(resumeMove);
                        }
                        elm.animFrame = requestAnimationFrame(resumeMove);
                    }, 300);
                }
            }
        }

        function correctDrop(boxRect, isLetter) {
            if (isLetter) {
                sfxCorrect();
                score++;
                document.getElementById('score').innerText = score;
            } else {
                sfxTrash();
            }
            createSparkles(boxRect.left + boxRect.width/2, boxRect.top + boxRect.height/2);
            currentCookie.remove();
            currentCookie = null;

            if (score >= 10) {
                sfxVictory();
                document.getElementById('modal').classList.add('active');
            } else {
                setTimeout(spawnCookie, 500);
            }
        }

        function restartGame() {
            document.getElementById('modal').classList.remove('active');
            if (currentCookie) { currentCookie.remove(); currentCookie = null; }
            score = 0;
            document.getElementById('score').innerText = score;
            setTimeout(spawnCookie, 500);
        }

        setTimeout(spawnCookie, 500);
    </script>
</body>
</html>
