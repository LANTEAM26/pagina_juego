<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍪 La Fábrica de Letras 🏭</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --factory-bg: #ffeaa7;
            --belt-color: #636e72;
            --box-upper: #0984e3;
            --box-lower: #00b894;
            --font-main: 'Fredoka', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            color: #d63031;
            margin: 10px 0 5px 0;
            font-size: 38px;
            text-shadow: 2px 2px 0px #fff, 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            letter-spacing: 1px;
        }

        /* SELECTOR DE MODO / NIVEL */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            z-index: 20;
        }
        .mode-btn {
            background: #fff;
            border: 3px solid #d63031;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #d63031;
            cursor: pointer;
            box-shadow: 0 4px 0 #d63031;
            transition: all 0.1s;
        }
        .mode-btn.active {
            background: #d63031;
            color: #fff;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8b0000;
        }

        .status-bar {
            display: flex;
            gap: 25px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 20px;
            color: #2d3436;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border: 3px solid #fff;
        }

        /* BOTÓN DE SONIDO */
        .sound-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: #fff;
            border: 3px solid #d63031;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #d63031;
            z-index: 50;
        }

        /* ESCENARIO DE LA FÁBRICA */
        .factory-area {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 450px;
            background: #74b9ff;
            border-radius: 30px;
            border: 6px solid #fff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* CINTA TRANSPORTADORA */
        .conveyor-belt {
            position: absolute;
            top: 200px;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--belt-color);
            border-top: 6px solid #2d3436;
            border-bottom: 6px solid #2d3436;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 30px, #b2bec3 30px, #b2bec3 50px);
            animation: moveBelt 2s linear infinite;
            z-index: 5;
        }

        .conveyor-belt.fast {
            animation-duration: 1s;
        }

        @keyframes moveBelt {
            0% { background-position: 0 0; }
            100% { background-position: 80px 0; }
        }

        /* CAJAS DE CLASIFICACIÓN */
        .boxes-container {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            z-index: 10;
            margin-top: 10px;
        }

        .factory-box {
            width: 180px;
            height: 120px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #fff;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            font-size: 20px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            position: relative;
        }

        .box-upper { background: var(--box-upper); box-shadow: 0 8px 0 #074b83; }
        .box-lower { background: var(--box-lower); box-shadow: 0 8px 0 #006248; }

        .factory-box span {
            font-size: 35px;
            margin-top: 5px;
        }

        /* GALLETA CON LETRA */
        .cookie {
            position: absolute;
            top: 195px;
            width: 80px;
            height: 80px;
            background: #e17055;
            border: 4px dashed #fab1a0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 8px 0 #b33939, inset 0 5px 10px rgba(255,255,255,0.4);
            cursor: grab;
            z-index: 20;
            font-family: 'Nunito', sans-serif;
            transition: transform 0.1s;
        }
        .cookie:active { cursor: grabbing; }

        /* MODAL DE VICTORIA / FIN */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center;
            z-index: 100; visibility: hidden; opacity: 0; transition: all 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff; padding: 35px; border-radius: 30px; text-align: center;
            max-width: 85%; transform: scale(0.7); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); border: 6px solid #d63031;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 32px; margin-bottom: 10px; color: #d63031; }
        .modal-btn {
            background: #00b894; border: none; padding: 12px 30px;
            font-size: 20px; color: white; border-radius: 20px; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 0 #006248; margin-top: 15px;
        }
        .modal-btn:active { transform: translateY(4px); box-shadow: none; }

        /* ESTRELLITAS */
        .sparkle {
            position: absolute; font-size: 35px; pointer-events: none; z-index: 100;
            animation: popOut 0.6s ease-out forwards;
        }
        @keyframes popOut {
            0% { transform: scale(0) translate(0, 0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c3683a3d.mp3?filename=fun-life-112588.mp3" type="audio/mpeg">
    </audio>

    <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</div>

    <h1>🍪 La Fábrica de Letras 🏭</h1>

    <div class="mode-selector">
        <button id="mode-chill" class="mode-btn active" onclick="setGameMode('chill')">🧸 Modo Tranquilo</button>
        <button id="mode-fast" class="mode-btn" onclick="setGameMode('fast')">⚡ Fábrica Rápida</button>
    </div>
    
    <div class="status-bar">
        <div>Galletas Empaquetadas: <span id="score">0</span> / 10</div>
    </div>

    <div class="factory-area" id="factoryArea">
        <!-- Cajas de clasificación -->
        <div class="boxes-container">
            <div class="factory-box box-upper" id="boxUpper">
                MAYÚSCULAS
                <span id="upper-sample">A</span>
            </div>
            <div class="factory-box box-lower" id="boxLower">
                minúsculas
                <span id="lower-sample">a</span>
            </div>
        </div>

        <!-- Cinta transportadora -->
        <div class="conveyor-belt" id="conveyorBelt"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="m-title">¡Excelente Trabajo! 🎉</h2>
            <p style="font-size: 18px; color: #555; font-weight: bold;" id="m-msg">¡Empaquetaste todas las galletas correctamente!</p>
            <button class="modal-btn" onclick="restartGame()">Jugar de Nuevo ➔</button>
        </div>
    </div>

    <script>
        // MOTOR DE AUDIO WEB API
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, soundEnabled = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function sfxCorrect() { playTone(587.33, 'triangle', 0.2, 0.15); setTimeout(() => playTone(880, 'triangle', 0.3, 0.15), 100); }
        function sfxWrong() { playTone(200, 'sine', 0.3, 0.2); }
        function sfxVictory() { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.3, 0.05), i * 150)); }

        function toggleSound() {
            initAudio();
            const bgm = document.getElementById('bgm');
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                document.getElementById('soundBtn').innerText = '🔊';
                bgm.volume = 0.2; bgm.play().catch(e => {});
            } else {
                document.getElementById('soundBtn').innerText = '🔇';
                bgm.pause();
            }
        }

        // LÓGICA DEL JUEGO
        const letterPairs = [
            { upper: 'A', lower: 'a' }, { upper: 'B', lower: 'b' }, { upper: 'C', lower: 'c' },
            { upper: 'D', lower: 'd' }, { upper: 'E', lower: 'e' }, { upper: 'F', lower: 'f' },
            { upper: 'G', lower: 'g' }, { upper: 'M', lower: 'm' }, { upper: 'P', lower: 'p' },
            { upper: 'S', lower: 's' }
        ];

        let score = 0;
        let gameMode = 'chill'; // 'chill' o 'fast'
        let currentCookie = null;
        let currentPair = null;
        let isSpawning = false;

        const factoryArea = document.getElementById('factoryArea');
        const conveyorBelt = document.getElementById('conveyorBelt');

        function setGameMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(mode === 'chill' ? 'mode-chill' : 'mode-fast').classList.add('active');
            
            if (mode === 'fast') {
                conveyorBelt.classList.add('fast');
            } else {
                conveyorBelt.classList.remove('fast');
            }
            restartGame();
        }

        function spawnCookie() {
            if (score >= 10 || currentCookie) return;

            // Elegir par de letras aleatorio
            currentPair = letterPairs[Math.floor(Math.random() * letterPairs.length)];
            let isUpper = Math.random() < 0.5;
            let letterChar = isUpper ? currentPair.upper : currentPair.lower;
            let type = isUpper ? 'upper' : 'lower';

            currentCookie = document.createElement('div');
            currentCookie.className = 'cookie';
            currentCookie.innerText = letterChar;
            currentCookie.dataset.type = type;

            // Posición inicial en la cinta (izquierda)
            currentCookie.style.left = '20px';
            factoryArea.appendChild(currentCookie);

            makeDraggable(currentCookie);

            // Movimiento automático de la cinta
            let pos = 20;
            let speed = gameMode === 'fast' ? 2.5 : 1.2;

            function move() {
                if (!currentCookie || currentCookie.dataset.dragging === 'true') return;
                pos += speed;
                currentCookie.style.left = pos + 'px';

                // Si llega al final de la cinta sin ser clasificada
                if (pos > factoryArea.offsetWidth - 100) {
                    currentCookie.remove();
                    currentCookie = null;
                    setTimeout(spawnCookie, 800);
                    return;
                }
                currentCookie.animFrame = requestAnimationFrame(move);
            }
            currentCookie.animFrame = requestAnimationFrame(move);
        }

        function createSparkles(x, y) {
            for(let i=0; i<6; i++) {
                let spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.innerText = ['✨', '🍪', '⭐'][Math.floor(Math.random()*3)];
                spark.style.left = x + 'px'; spark.style.top = y + 'px';
                spark.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                spark.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function makeDraggable(elm) {
            let posX = 0, posY = 0, startLeft = 0, startTop = 0;

            elm.onmousedown = dragStart;
            elm.ontouchstart = dragStart;

            function dragStart(e) {
                initAudio();
                e.preventDefault();
                cancelAnimationFrame(elm.animFrame);
                elm.dataset.dragging = 'true';

                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;

                startLeft = elm.offsetLeft;
                startTop = elm.offsetTop;
                posX = clientX; posY = clientY;

                document.onmousemove = dragMove; document.ontouchmove = dragMove;
                document.onmouseup = dragEnd; document.ontouchend = dragEnd;
            }

            function dragMove(e) {
                e.preventDefault();
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;
                elm.style.left = (startLeft + (clientX - posX)) + 'px';
                elm.style.top = (startTop + (clientY - posY)) + 'px';
            }

            function dragEnd() {
                document.onmousemove = null; document.ontouchmove = null;
                document.onmouseup = null; document.ontouchend = null;
                elm.dataset.dragging = 'false';

                let cookieRect = elm.getBoundingClientRect();
                let upperRect = document.getElementById('boxUpper').getBoundingClientRect();
                let lowerRect = document.getElementById('boxLower').getBoundingClientRect();

                let droppedInBox = false;

                // Comprobar caja Mayúsculas
                if (cookieRect.left < upperRect.right && cookieRect.right > upperRect.left &&
                    cookieRect.top < upperRect.bottom && cookieRect.bottom > upperRect.top) {
                    if (elm.dataset.type === 'upper') {
                        correctDrop(upperRect);
                    } else {
                        wrongDrop(startLeft, startTop);
                    }
                    droppedInBox = true;
                }
                // Comprobar caja minúsculas
                else if (cookieRect.left < lowerRect.right && cookieRect.right > lowerRect.left &&
                           cookieRect.top < lowerRect.bottom && cookieRect.bottom > lowerRect.top) {
                    if (elm.dataset.type === 'lower') {
                        correctDrop(lowerRect);
                    } else {
                        wrongDrop(startLeft, startTop);
                    }
                    droppedInBox = true;
                }

                if (!droppedInBox) {
                    // Si la suelta fuera, reanuda su movimiento en la cinta
                    let pos = elm.offsetLeft;
                    let speed = gameMode === 'fast' ? 2.5 : 1.2;
                    function moveBack() {
                        if (!elm || elm.dataset.dragging === 'true') return;
                        pos += speed; elm.style.left = pos + 'px';
                        if (pos > factoryArea.offsetWidth - 100) { elm.remove(); currentCookie = null; setTimeout(spawnCookie, 800); return; }
                        elm.animFrame = requestAnimationFrame(moveBack);
                    }
                    elm.animFrame = requestAnimationFrame(moveBack);
                }
            }
        }

        function correctDrop(boxRect) {
            sfxCorrect();
            createSparkles(boxRect.left + boxRect.width/2, boxRect.top + boxRect.height/2);
            currentCookie.remove();
            currentCookie = null;
            score++;
            document.getElementById('score').innerText = score;

            if (score >= 10) {
                sfxVictory();
                document.getElementById('modal').classList.add('active');
            } else {
                setTimeout(spawnCookie, 600);
            }
        }

        function wrongDrop(origLeft, origTop) {
            sfxWrong();
            currentCookie.style.transition = 'all 0.3s';
            currentCookie.style.left = origLeft + 'px';
            currentCookie.style.top = origTop + 'px';
            setTimeout(() => {
                currentCookie.style.transition = 'none';
                let pos = origLeft;
                let speed = gameMode === 'fast' ? 2.5 : 1.2;
                function moveAgain() {
                    if (!currentCookie || currentCookie.dataset.dragging === 'true') return;
                    pos += speed; currentCookie.style.left = pos + 'px';
                    if (pos > factoryArea.offsetWidth - 100) { currentCookie.remove(); currentCookie = null; setTimeout(spawnCookie, 800); return; }
                    currentCookie.animFrame = requestAnimationFrame(moveAgain);
                }
                currentCookie.animFrame = requestAnimationFrame(moveAgain);
            }, 300);
        }

        function restartGame() {
            document.getElementById('modal').classList.remove('active');
            if (currentCookie) { currentCookie.remove(); currentCookie = null; }
            score = 0;
            document.getElementById('score').innerText = score;
            setTimeout(spawnCookie, 500);
        }

        // Iniciar juego
        setTimeout(spawnCookie, 500);
    </script>
</body>
</html>
