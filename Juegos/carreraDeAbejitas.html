<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Carrera de Abejitas! 🐝</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --grid-bg: #8d6e63;
        }

        /* DISEÑO CERO SCROLL - 100VH EXACTO ESTRICTO */
        body, html {
            font-family: 'Fredoka', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            touch-action: manipulation; color: #333; background-color: transparent; 
            overflow: hidden; box-sizing: border-box;
        }

        /* PAISAJE DE FONDO */
        .decorations { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; overflow: hidden; background: linear-gradient(180deg, #74ebd5 0%, #ACB6E5 100%); }
        .decorations::before { content: ''; position: absolute; inset: 0; background-image: url("data:image/svg+xml,%3Csvg width='60' height='104' viewBox='0 0 60 104' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 52l15-26 15 26v52l-15 26-15-26zM0 0l15 26v52L0 104V0zm60 0v104L45 78V26z' fill='%23ffffff' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E"); z-index: 1; }
        .sun { position: absolute; top: 2%; right: 4%; font-size: clamp(40px, 8vh, 80px); z-index: 2; filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8)); animation: pulse-sun 3s infinite alternate; }
        @keyframes pulse-sun { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1.1) rotate(10deg); } }
        .grass { position: absolute; bottom: -5vh; left: -10vw; width: 120vw; height: 25vh; background: #a9dfbf; border-radius: 50% 50% 0 0; z-index: 2; box-shadow: inset 0 15px 0 #82e0aa, 0 -30px 50px rgba(46,204,113,0.3); }

        /* ============================================================
           PANTALLA DE CONFIGURACIÓN PREVIA (LOBBY)
           ============================================================ */
        #setup-screen {
            position: absolute; inset: 0; z-index: 500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
        }

        .setup-card {
            background: white; padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 6px solid #ffb74d;
            text-align: center; max-width: 90%; width: 550px;
            display: flex; flex-direction: column; gap: 15px;
        }

        .setup-card h1 { font-size: 32px; color: #ff9800; margin: 0; text-shadow: none;}
        
        .setup-section {
            background: #fff9c4; padding: 12px; border-radius: 15px; border: 2px dashed #f1c40f;
            display: flex; flex-direction: column; gap: 10px; align-items: center;
        }
        .setup-section h3 { margin: 0; color: #d35400; font-size: 16px; text-transform: uppercase;}
        
        .setup-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%;}
        
        .setup-btn { background: #fff; border: 3px solid #bdc3c7; padding: 8px 16px; border-radius: 15px; font-size: 15px; font-weight: bold; color: #7f8c8d; cursor: pointer; transition: all 0.2s; font-family: 'Fredoka', sans-serif;}
        .setup-btn.active.mode { background: #9b59b6; border-color: #8e44ad; color: #fff; box-shadow: 0 4px 0 #8e44ad; transform: translateY(-2px); }
        .setup-btn.active.diff { background: #f1c40f; border-color: #f39c12; color: #d35400; box-shadow: 0 4px 0 #f39c12; transform: translateY(-2px); }

        .time-input-group { display: flex; align-items: center; gap: 10px; background: #fff; padding: 6px 15px; border-radius: 15px; border: 3px solid #3498db;}
        .time-input-group label { color: #2980b9; font-weight: bold; font-size: 16px; }
        .time-input-group input { width: 60px; border: 2px solid #2980b9; border-radius: 8px; text-align: center; font-weight: bold; font-family: 'Fredoka', sans-serif; font-size: 16px; padding: 4px; outline: none;}
        
        .start-btn {
            background: #4CAF50; border: none; box-shadow: 0 6px 0 #388E3C; padding: 12px 30px; font-size: 22px; color: white; border-radius: 15px; text-transform: uppercase; font-weight: bold; font-family: 'Fredoka', sans-serif; cursor:pointer; margin-top: 5px; transition: all 0.1s;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #388E3C; }

        /* ============================================================
           PANTALLA DE JUEGO (GAME SCREEN)
           ============================================================ */
        #game-screen {
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100vw; height: 100vh; padding: 1vh 1vw; box-sizing: border-box; overflow: hidden;
        }

        .game-header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px;
            margin-bottom: 5px; z-index: 10;
        }
        .game-header h1 { font-size: clamp(20px, 3vh, 32px); margin: 0; color: #2c3e50; text-shadow: 2px 2px 0px #fff;}
        
        .back-menu-btn { background: #ecf0f1; border: 2px solid #bdc3c7; padding: 6px 12px; border-radius: 12px; font-size: clamp(11px, 1.5vh, 16px); font-weight: bold; color: #2c3e50; cursor: pointer; transition: all 0.2s; font-family: 'Fredoka', sans-serif; box-shadow: 0 4px 0 #bdc3c7;}
        .back-menu-btn:active { transform: translateY(4px); box-shadow: none; }

        /* TEMPORIZADOR FLOTANTE */
        .timer-container {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #fff; border: 3px solid #3498db; color: #2980b9; padding: 4px 15px;
            border-radius: 20px; font-size: clamp(16px, 2.5vh, 22px); font-weight: 900; box-shadow: 0 4px 0 #2980b9;
        }
        .timer-container.warning { border-color: #e74c3c; color: #c0392b; box-shadow: 0 4px 0 #e74c3c; animation: pulseTimer 0.5s infinite alternate; }
        @keyframes pulseTimer { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .timer-btn { background: #3498db; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #2980b9; }
        .timer-btn:active { transform: translateY(3px); box-shadow: none; }
        .timer-container.warning .timer-btn { background: #e74c3c; box-shadow: 0 3px 0 #c0392b; }

        /* ============================================================
           CONTENEDOR PRINCIPAL FLUIDO Y CONSTREÑIDO
           ============================================================ */
        #game-board-area {
            flex: 1 1 auto; width: 100%; display: flex; justify-content: center; align-items: center; 
            z-index: 10; min-height: 0; box-sizing: border-box; margin-bottom: 1vh;
        }
        
        /* === MODO 2 JUGADORES === */
        .shared-wrapper { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            gap: 1.5vh; height: 100%; width: 100%; max-width: 800px; margin: 0 auto;
        }
        .shared-wrapper .grid-wrapper { 
            flex: 0 0 auto; width: 100%; max-width: 45vh; aspect-ratio: 1/1; margin: 0 auto;
            background: #ffe0b2; padding: 1vh; border-radius: 12px; box-shadow: 0 4px 0 #ffb74d; box-sizing: border-box;
        }
        .panels-shared { 
            display: flex; width: 100%; gap: 15px; justify-content: center; flex-direction: row; flex: 1 1 auto; min-height: 0;
        }
        .panels-shared .panel {
            flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start;
        }

        /* === MODO 3, 4 Y 2v2 (1 FILA DE ESTACIONES, MAXIMIZADO) === */
        body.mode-multi .stations-container {
            display: flex; flex-direction: row; flex-wrap: nowrap;
            gap: 1vw; width: 100%; max-width: 1800px; height: 100%; justify-content: center; align-items: stretch;
        }
        body.mode-multi .station {
            background: rgba(255,255,255,0.95); border-radius: 15px; border: 3px solid #fff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; 
            padding: 1.2vh 1vw; gap: 1.2vh; align-items: center; justify-content: flex-start;
            flex: 1 1 0; min-width: 0; box-sizing: border-box; height: 100%;
        }
        body.mode-multi .grid-wrapper {
            width: 100%; max-width: min(100%, 45vh);
            aspect-ratio: 1/1; flex-shrink: 0; margin: 0 auto;
            background: #ffe0b2; padding: 6px; border-radius: 12px; box-shadow: 0 4px 0 #ffb74d; box-sizing: border-box;
        }
        body.mode-multi .panel {
            width: 100%; flex: 1 1 auto; padding: 5px; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start;
            background: transparent; box-shadow: none; border: none; gap: 1vh;
        }
        body.mode-multi .panel h3 { font-size: clamp(14px, 2.5vh, 20px); margin-bottom: 2px; border-bottom: 2px dashed rgba(0,0,0,0.2); padding-bottom: 2px;}
        body.mode-multi .controls-row { margin-bottom: 0; }
        body.mode-multi .cmd-btn { font-size: clamp(16px, 3vh, 26px); padding: 1vh 2px; border-radius: 8px;}
        body.mode-multi .seq-container { flex: 1 1 auto; padding: 6px; gap: 4px; border: 3px dashed rgba(0,0,0,0.1); border-radius: 10px; background: rgba(0,0,0,0.05);}
        body.mode-multi .cmd-block { width: clamp(20px, 3.5vh, 32px); height: clamp(20px, 3.5vh, 32px); font-size: clamp(11px, 2vh, 16px); border-radius: 6px; }
        body.mode-multi .btn-text { display: none; } /* Oculta el texto para que los botones sean masivos y legibles */

        /* DISEÑO DE LA CUADRÍCULA INTERNA (COMÚN) */
        .game-grid { display: grid; width: 100%; height: 100%; gap: 3px; background-color: var(--grid-bg); border-radius: 8px; padding: 3px; box-sizing: border-box;}
        .cell { background-color: #fff9c4; border-radius: 6px; display: flex; justify-content: center; align-items: center; position: relative; user-select: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1); }
        .obstacle-cell { background-color: #95a5a6 !important; box-shadow: inset 0 -3px 0 #7f8c8d !important; }
        
        /* EMojis Escalan Dinámicamente */
        .obstacle-cell::after { content: '🪨'; font-size: clamp(16px, 4vh, 32px); position: absolute; }
        .target-emoji { font-size: clamp(16px, 4vh, 32px); animation: pulseTarget 1.5s infinite alternate; position: absolute;}
        @keyframes pulseTarget { 0% { transform: scale(1); } 100% { transform: scale(0.85); } }

        /* ABEJAS */
        .bee-container { position: absolute; z-index: 5; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .bee-orientation { transition: transform 0.2s ease; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .bee-sprite { display: flex; justify-content: center; align-items: center; width: 75%; height: 75%; animation: float 2s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }

        /* PANELES DE COMANDOS (DISEÑO BASE 2 JUGADORES) */
        .panel { box-sizing: border-box; background: #fff; padding: 12px; border-radius: 12px; width: 100%; display: flex; flex-direction: column;}
        .panel h3 { margin: 0 0 1vh 0; font-size: clamp(14px, 2vh, 20px); display: flex; justify-content: space-between; width: 100%; align-items: center; border-bottom: 2px dashed rgba(0,0,0,0.1); padding-bottom: 4px;}
        .score-badge { background: #333; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: clamp(12px, 1.8vh, 16px); text-shadow: none;}

        .controls-row { display: flex; width: 100%; gap: 6px; margin-bottom: 1vh; justify-content: center; flex-wrap: nowrap;}
        
        button.cmd-btn { 
            flex: 1; padding: 1vh 2px; font-size: clamp(14px, 2.5vh, 20px); font-weight: bold; color: white; border: none; border-radius: 8px; 
            cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: all 0.1s; font-family: 'Fredoka', sans-serif;
            display: flex; justify-content: center; align-items: center; gap: 4px;
        }
        button.cmd-btn:active { transform: translateY(3px); box-shadow: none !important; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none !important;}
        .undo-btn { background-color: #e74c3c !important; box-shadow: 0 4px 0 #c0392b !important; }

        .seq-container { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; min-height: 5vh; background: rgba(0,0,0,0.03); padding: 8px; border-radius: 12px; width: 100%; box-sizing: border-box; border: 2px dashed rgba(0,0,0,0.1); align-content: flex-start;}
        .cmd-block { display: inline-flex; align-items: center; justify-content: center; width: clamp(20px, 3vh, 28px); height: clamp(20px, 3vh, 28px); border-radius: 6px; color: white; font-weight: bold; font-size: clamp(11px, 1.8vh, 15px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); animation: popIn 0.2s ease-out; }

        /* CONTROLES GLOBALES DE EJECUCIÓN (HASTA ABAJO) */
        .global-controls { flex: 0 0 auto; display: flex; justify-content: center; gap: 15px; margin-bottom: 2vh; position: relative; z-index: 10; width: 100%; max-width: 600px;}
        button.global-btn { padding: 1.5vh 25px; font-size: clamp(18px, 3vh, 24px); color: white; border-radius: 15px; letter-spacing: 1px; font-weight: bold; font-family: 'Fredoka', sans-serif; border:none; cursor:pointer;}
        button#go-btn { background-color: #ff9800; box-shadow: 0 5px 0 #f57c00; flex: 2; transition: all 0.1s;}
        button.reset-btn { background-color: #e74c3c; box-shadow: 0 5px 0 #c0392b; flex: 1; transition: all 0.1s;}
        button.global-btn:active { transform: translateY(4px); box-shadow: none !important; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s; backdrop-filter: blur(5px);}
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: white; padding: 30px; border-radius: 25px; text-align: center; max-width: 85%; width: 500px; transform: scale(0.7); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 15px 40px rgba(0,0,0,0.3); border: 8px solid #ff9800;}
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 32px; margin-top: 0; margin-bottom: 15px; color: #ff9800; }
        .modal-msg { font-size: 20px; margin-bottom: 25px; color: #555; white-space: pre-line; line-height: 1.4; font-weight: 600;}
        .modal-btn { background: #4CAF50; border: none; box-shadow: 0 6px 0 #388E3C; padding: 15px 40px; font-size: 20px; color: white; border-radius: 15px; text-transform: uppercase; font-weight: bold; font-family: 'Fredoka', sans-serif; cursor:pointer;}
        .modal-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="../assets/musicaFondo/cancion1.mp3" type="audio/mpeg">
    </audio>

    <div class="decorations">
        <div class="sun">☀️</div>
        <div class="grass"></div>
    </div>

    <!-- ============================================================
         PANTALLA DE CONFIGURACIÓN (LOBBY)
         ============================================================ -->
    <div id="setup-screen">
        <div class="setup-card">
            <h1>Configuración ⚙️</h1>
            
            <div class="setup-section">
                <h3>Modo de Juego</h3>
                <div class="setup-row">
                    <button id="setup-mode-2" class="setup-btn mode active" onclick="selectMode(2)">👫 2 Jugadores</button>
                    <button id="setup-mode-3" class="setup-btn mode" onclick="selectMode(3)">🧑‍🤝‍🧑 3 Jugadores</button>
                    <button id="setup-mode-4" class="setup-btn mode" onclick="selectMode(4)">🧑‍🤝‍🧑 4 Jugadores</button>
                    <button id="setup-mode-2v2" class="setup-btn mode" onclick="selectMode('2v2')">🤝 4 Jug. (2v2)</button>
                </div>
            </div>

            <div class="setup-section">
                <h3>Tamaño del Mapa</h3>
                <div class="setup-row">
                    <button id="setup-diff-1" class="setup-btn diff active" onclick="selectDiff(1)">⭐ Pequeño</button>
                    <button id="setup-diff-2" class="setup-btn diff" onclick="selectDiff(2)">⭐⭐ Mediano</button>
                    <button id="setup-diff-3" class="setup-btn diff" onclick="selectDiff(3)">⭐⭐⭐ Grande</button>
                </div>
            </div>

            <div class="setup-section">
                <h3>Límite de Tiempo</h3>
                <div class="time-input-group">
                    <label>⏳ Segundos:</label>
                    <input type="number" id="setup-time" value="120" min="0" max="999">
                </div>
                <span style="font-size:13px; color:#7f8c8d; font-weight:bold;">(Escribe 0 para jugar sin límite de tiempo)</span>
            </div>

            <button class="start-btn" onclick="startGame()">¡Comenzar Carrera!</button>
        </div>
    </div>

    <!-- ============================================================
         PANTALLA DEL JUEGO
         ============================================================ -->
    <div id="game-screen">
        
        <div class="game-header">
            <button class="back-menu-btn" onclick="backToMenu()">⚙️ Volver al Menú</button>
            <h1>¡Carrera de Abejitas! 🐝</h1>
            <div id="timer-display" class="timer-container" style="display: none;">
                <button id="timer-ctrl-btn" class="timer-btn" onclick="toggleTimer()">▶</button>
                <span><span id="time-left">00:00</span></span>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO FLUIDO CERO SCROLL -->
        <div id="game-board-area"></div>
        
        <div class="global-controls">
            <button class="global-btn" onclick="executeCommands(false)" id="go-btn">🚀 ¡VOLAR Y COMER!</button>
            <button class="global-btn reset-btn" onclick="resetGame()">🔄 Reset</button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="m-title">Título</h2>
            <p class="modal-msg" id="m-msg">Mensaje</p>
            <button class="modal-btn" onclick="closeModal()">¡Genial!</button>
        </div>
    </div>

    <script>
        // MOTOR DE SONIDO
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let audioInitialized = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!audioInitialized) {
                const bgm = document.getElementById('bgm');
                bgm.volume = 0.25; bgm.play().catch(e => console.log("Autoplay bloqueado"));
                audioInitialized = true;
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function sfxClick() { playTone(600, 'sine', 0.08, 0.1); }
        function sfxMove() { playTone(350, 'triangle', 0.1, 0.1); }
        function sfxEat() { playTone(880, 'sine', 0.15, 0.15); setTimeout(() => playTone(1174.66, 'sine', 0.2, 0.15), 80); }
        function sfxVictory() { let notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((freq, i) => { setTimeout(() => playTone(freq, 'square', 0.3, 0.1), i * 150); }); }

        // ESTADO DE CONFIGURACIÓN Y JUEGO
        let gameMode = 2; // 2, 3, 4, '2v2'
        let currentDifficulty = 1;
        let gridSize = 4; 
        let isExecuting = false;
        
        let initialTimeLimit = 120; 
        let timerInterval = null;
        let timeLeft = 0; 
        let isTimerRunning = false;

        let totalItemsTarget = 0; 
        let logicalMap = { obstacles: new Set(), targets: {} };
        let players = {};

        // COLORES Y FILTROS CORREGIDOS
        function getPlayerConfigs() {
            if (gameMode === '2v2') {
                return [
                    { id: 1, name: 'Eq. Azul 1', color: '#3498db', dark: '#2980b9', emoji: '💧', beeFilter: 'filter: hue-rotate(160deg) saturate(1.5);' },
                    { id: 2, name: 'Eq. Azul 2', color: '#00cec9', dark: '#00b894', emoji: '💧', beeFilter: 'filter: hue-rotate(160deg) saturate(1.5) brightness(1.2);' },
                    { id: 3, name: 'Eq. Rojo 1', color: '#e74c3c', dark: '#c0392b', emoji: '🔥', beeFilter: 'filter: hue-rotate(300deg) saturate(2);' },
                    { id: 4, name: 'Eq. Rojo 2', color: '#e67e22', dark: '#d35400', emoji: '🔥', beeFilter: 'filter: hue-rotate(320deg) saturate(2);' }
                ];
            } else {
                return [
                    { id: 1, name: 'Azul', color: '#3498db', dark: '#2980b9', emoji: '💧', beeFilter: 'filter: hue-rotate(160deg) saturate(1.5);' },
                    { id: 2, name: 'Verde', color: '#2ecc71', dark: '#27ae60', emoji: '🍃', beeFilter: 'filter: hue-rotate(70deg) saturate(1.5);' },
                    { id: 3, name: 'Naranja', color: '#e67e22', dark: '#d35400', emoji: '🍯', beeFilter: 'filter: hue-rotate(-20deg) saturate(2);' },
                    { id: 4, name: 'Morado', color: '#9b59b6', dark: '#8e44ad', emoji: '🍇', beeFilter: 'filter: hue-rotate(220deg) saturate(1.5);' }
                ];
            }
        }

        // CONTROL DEL LOBBY
        function selectMode(mode) {
            sfxClick();
            gameMode = mode;
            document.querySelectorAll('.setup-btn.mode').forEach(btn => btn.classList.remove('active'));
            document.getElementById('setup-mode-' + mode).classList.add('active');
        }

        function selectDiff(level) {
            sfxClick();
            currentDifficulty = level;
            document.querySelectorAll('.setup-btn.diff').forEach(btn => btn.classList.remove('active'));
            document.getElementById('setup-diff-' + level).classList.add('active');
        }

        function startGame() {
            initAudio(); sfxClick();
            
            let val = parseInt(document.getElementById('setup-time').value);
            if(isNaN(val) || val < 0) val = 0;
            initialTimeLimit = val;

            gridSize = currentDifficulty === 1 ? 4 : (currentDifficulty === 2 ? 5 : 6);
            
            if (gameMode === 3 || gameMode === 4 || gameMode === '2v2') document.body.classList.add('mode-multi');
            else document.body.classList.remove('mode-multi');

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            resetGame();
        }

        function backToMenu() {
            initAudio(); sfxClick();
            clearInterval(timerInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // CONTROL DEL TEMPORIZADOR
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60); let s = seconds % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function toggleTimer() {
            initAudio(); sfxClick();
            if (initialTimeLimit === 0 || isExecuting) return;
            isTimerRunning = !isTimerRunning;
            document.getElementById('timer-ctrl-btn').innerText = isTimerRunning ? "⏸" : "▶";
        }

        function setupTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false; 
            
            let display = document.getElementById('timer-display');
            let timeSpan = document.getElementById('time-left');
            let btn = document.getElementById('timer-ctrl-btn');

            display.classList.remove('warning');
            
            if (initialTimeLimit > 0) {
                timeLeft = initialTimeLimit;
                display.style.display = 'flex';
                timeSpan.innerText = formatTime(timeLeft);
                btn.innerText = "▶";
                
                timerInterval = setInterval(() => {
                    if (!isTimerRunning || isExecuting || document.getElementById('modal').classList.contains('active')) return;
                    
                    timeLeft--;
                    timeSpan.innerText = formatTime(timeLeft);
                    
                    if (timeLeft === 10) { display.classList.add('warning'); playTone(300, 'sawtooth', 0.2, 0.15); }
                    
                    if (timeLeft <= 0) {
                        isTimerRunning = false;
                        clearInterval(timerInterval);
                        playTone(150, 'sawtooth', 0.4, 0.3);
                        document.getElementById('go-btn').disabled = true;
                        
                        // FUERZA EJECUCIÓN AUTOMÁTICA AL TERMINAR TIEMPO
                        if (!isExecuting) executeCommands(true); 
                    }
                }, 1000);
            } else {
                display.style.display = 'none';
            }
        }

        function getActiveIds() {
            if (gameMode === 2) return [1, 2];
            if (gameMode === 3) return [1, 2, 3];
            return [1, 2, 3, 4]; // 4 o 2v2
        }

        function buildDOM() {
            const container = document.getElementById('game-board-area');
            container.innerHTML = '';
            let styleGrid = `grid-template-columns: repeat(${gridSize}, 1fr); grid-template-rows: repeat(${gridSize}, 1fr);`;

            if (gameMode === 2) {
                // MODO 2: GRID ARRIBA (Protegido por aspecto), PANELES ABAJO
                let html = `
                    <div class="shared-wrapper">
                        <div class="grid-wrapper">
                            <div id="grid-shared" class="game-grid" style="${styleGrid}"></div>
                        </div>
                        <div class="panels-shared">
                            ${buildPanelHTML(1)}
                            ${buildPanelHTML(2)}
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                buildGridCells('grid-shared');
            } else {
                // MODO 3, 4 / 2v2: 1 FILA HORIZONTAL DE N ESTACIONES
                let activeIds = getActiveIds();
                let html = `<div class="stations-container">`;
                activeIds.forEach(i => {
                    html += `
                        <div class="station">
                            <div class="grid-wrapper">
                                <div id="grid-p${i}" class="game-grid" style="${styleGrid}"></div>
                            </div>
                            ${buildPanelHTML(i)}
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
                activeIds.forEach(i => buildGridCells(`grid-p${i}`, i));
            }
        }

        function buildGridCells(containerId, pId = null) {
            const gridEl = document.getElementById(containerId);
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div'); 
                    cell.className = 'cell'; 
                    cell.id = gameMode === 2 ? `cell-shared-${x}-${y}` : `cell-p${pId}-${x}-${y}`;
                    gridEl.appendChild(cell);
                }
            }
        }

        function buildPanelHTML(id) {
            let configs = getPlayerConfigs();
            let conf = configs[id-1];
            let teamName = gameMode === '2v2' ? (id <= 2 ? 'Azules' : 'Rojos') : conf.name;
            
            return `
                <div class="panel" style="${gameMode !== 2 ? `border: none;` : `border: 4px solid ${conf.color}; box-shadow: 0 4px 0${conf.dark}`}">
                    <h3 style="color: ${conf.dark}">🐝 ${teamName} <span class="score-badge" id="score-${id}" style="background:${conf.dark}">0 / ${totalItemsTarget}</span></h3>
                    <div class="controls-row">
                        <button class="cmd-btn" style="background:${conf.color}; box-shadow: 0 3px 0 ${conf.dark}" onclick="addCommand(${id}, 'F')">⬆️<span class="btn-text"> Avanza</span></button>
                        <button class="cmd-btn" style="background:${conf.color}; box-shadow: 0 3px 0 ${conf.dark}" onclick="addCommand(${id}, 'B')">⬇<span class="btn-text"> Atrás</span></button>
                    </div>
                    <div class="controls-row">
                        <button class="cmd-btn" style="background:${conf.color}; box-shadow: 0 3px 0 ${conf.dark}" onclick="addCommand(${id}, 'L')">↺<span class="btn-text"> Izq</span></button>
                        <button class="cmd-btn" style="background:${conf.color}; box-shadow: 0 3px 0 ${conf.dark}" onclick="addCommand(${id}, 'R')">↻<span class="btn-text"> Der</span></button>
                        <button class="cmd-btn undo-btn" onclick="undoCommand(${id})">❌<span class="btn-text"> Borrar</span></button>
                    </div>
                    <div class="seq-container" id="seq${id}"></div>
                </div>
            `;
        }

        function checkReachable(startX, startY, targetsArray, obsSet) {
            let visited = new Set(); let queue = [{x: startX, y: startY}];
            visited.add(`${startX},${startY}`); let foundTargets = 0;
            while(queue.length > 0) {
                let curr = queue.shift();
                let dirs = [[0,1], [1,0], [0,-1], [-1,0]];
                for(let d of dirs) {
                    let nx = curr.x + d[0], ny = curr.y + d[1];
                    if(nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
                        let key = `${nx},${ny}`;
                        if(!visited.has(key) && !obsSet.has(key)) {
                            visited.add(key); queue.push({x: nx, y: ny});
                            if(targetsArray.some(t => t.x === nx && t.y === ny)) foundTargets++;
                        }
                    }
                }
            }
            return foundTargets === targetsArray.length;
        }

        function generateMapLogic() {
            let valid = false; let attempts = 0;
            let targetCount = currentDifficulty === 1 ? 3 : (currentDifficulty === 2 ? 4 : 5);
            totalItemsTarget = targetCount;
            let obsCountPerSide = currentDifficulty === 1 ? 0 : (currentDifficulty === 2 ? 2 : 4);

            while (!valid && attempts < 200) {
                attempts++;
                logicalMap.obstacles.clear(); logicalMap.targets = {};
                
                let obsPlaced = 0; let obsAttempts = 0;
                while(obsPlaced < obsCountPerSide * 2 && obsAttempts < 100) {
                    obsAttempts++;
                    let rx = Math.floor(Math.random() * gridSize); let ry = Math.floor(Math.random() * gridSize);
                    let key = `${rx},${ry}`;
                    if ((rx === 0 && ry === 0) || (rx === gridSize-1 && ry === gridSize-1)) continue;
                    if (!logicalMap.obstacles.has(key)) { logicalMap.obstacles.add(key); obsPlaced++; }
                }

                if (gameMode === 2) {
                    logicalMap.targets[1] = spawnTargetsArray(targetCount, logicalMap.obstacles, []);
                    logicalMap.targets[2] = spawnTargetsArray(targetCount, logicalMap.obstacles, [logicalMap.targets[1]]);
                    let r1 = checkReachable(0, 0, logicalMap.targets[1], logicalMap.obstacles);
                    let r2 = checkReachable(gridSize-1, gridSize-1, logicalMap.targets[2], logicalMap.obstacles);
                    if(r1 && r2) valid = true;
                } else {
                    let sharedT = spawnTargetsArray(targetCount, logicalMap.obstacles, []);
                    let r1 = checkReachable(0, 0, sharedT, logicalMap.obstacles);
                    if(r1) {
                        let activeIds = getActiveIds();
                        activeIds.forEach(i => logicalMap.targets[i] = sharedT.map(t => ({...t})));
                        valid = true;
                    }
                }
            }
        }

        function spawnTargetsArray(count, obsSet, avoidArrays) {
            let tgs = []; let attempts = 0;
            while (tgs.length < count && attempts < 100) {
                attempts++;
                let rx = Math.floor(Math.random() * gridSize); let ry = Math.floor(Math.random() * gridSize);
                let key = `${rx},${ry}`;
                if ((rx === 0 && ry === 0) || (rx === gridSize-1 && ry === gridSize-1)) continue;
                if (obsSet.has(key)) continue;

                let overlap = false;
                for (let arr of avoidArrays) { if (arr.some(t => t.x === rx && t.y === ry)) overlap = true; }
                if (tgs.some(t => t.x === rx && t.y === ry)) overlap = true;

                if (!overlap) tgs.push({x: rx, y: ry, collected: false});
            }
            return tgs;
        }

        function populateDOM() {
            let configs = getPlayerConfigs();
            let activeIds = getActiveIds();
            
            activeIds.forEach(i => {
                document.getElementById(`score-${i}`).innerText = `0 / ${totalItemsTarget}`;
            });

            logicalMap.obstacles.forEach(key => {
                let [x,y] = key.split(',');
                if (gameMode === 2) {
                    document.getElementById(`cell-shared-${x}-${y}`).classList.add('obstacle-cell');
                } else {
                    activeIds.forEach(i => {
                        let cell = document.getElementById(`cell-p${i}-${x}-${y}`);
                        if(cell) cell.classList.add('obstacle-cell');
                    });
                }
            });

            activeIds.forEach(i => {
                let emoji = gameMode === 2 ? configs[i-1].emoji : configs[i-1].emoji; 
                let color = gameMode === 2 ? configs[i-1].color : configs[i-1].color;
                
                logicalMap.targets[i].forEach(t => {
                    let cellId = gameMode === 2 ? `cell-shared-${t.x}-${t.y}` : `cell-p${i}-${t.x}-${t.y}`;
                    let c = document.getElementById(cellId);
                    if(c) {
                        c.classList.add(`target-p${i}`);
                        c.style.boxShadow = `inset 0 0 15px ${color}`;
                        let span = document.createElement('span');
                        span.className = 'target-emoji';
                        span.innerText = emoji;
                        c.appendChild(span);
                    }
                });
            });
        }

        function getTransform(dir) { 
            if (dir === 0) return 'rotate(90deg)';   
            if (dir === 1) return 'rotate(180deg)';  
            if (dir === 2) return 'rotate(-90deg)';  
            if (dir === 3) return 'rotate(0deg)';    
        }

        function drawBees() {
            document.querySelectorAll('.bee-container').forEach(b => b.remove());
            let configs = getPlayerConfigs();
            let activeIds = getActiveIds();
            
            activeIds.forEach(id => {
                let p = players[id];
                let cellId = gameMode === 2 ? `cell-shared-${p.pos.x}-${p.pos.y}` : `cell-p${id}-${p.pos.x}-${p.pos.y}`;
                let cell = document.getElementById(cellId);
                
                const container = document.createElement('div'); container.className = `bee-container bee${id}`;
                const orientation = document.createElement('div'); orientation.className = 'bee-orientation'; orientation.style.transform = getTransform(p.dir);
                const sprite = document.createElement('div'); sprite.className = 'bee-sprite';
                
                sprite.innerHTML = `<img src="../assets/robots/BeebotEmoji.png" alt="Bee" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none; ${configs[id-1].beeFilter}">`;
                
                orientation.appendChild(sprite); container.appendChild(orientation); 
                
                if (gameMode === 2 && id === 2 && players[1].pos.x === players[2].pos.x && players[1].pos.y === players[2].pos.y) {
                    container.style.marginTop = '15px'; container.style.marginLeft = '15px';
                    let prevBee = cell.querySelector('.bee1');
                    if(prevBee) { prevBee.style.marginTop = '-15px'; prevBee.style.marginLeft = '-15px'; }
                }
                
                if (cell) cell.appendChild(container);
            });
        }

        function undoCommand(id) {
            initAudio(); sfxClick();
            if (isExecuting || (initialTimeLimit > 0 && timeLeft <= 0)) return;
            if (players[id].commands.length === 0) return;
            players[id].commands.pop();
            updateSequenceUI(id);
        }

        function addCommand(id, cmd) { 
            initAudio(); sfxClick();
            if(isExecuting || (initialTimeLimit > 0 && timeLeft <= 0)) return; 
            players[id].commands.push(cmd); 
            updateSequenceUI(id); 
        }

        function updateSequenceUI(id) {
            const symbols = { 'F': '⬆', 'B': '⬇', 'R': '↻', 'L': '↺' }; 
            const container = document.getElementById(`seq${id}`); container.innerHTML = ''; 
            let configs = getPlayerConfigs();
            let conf = configs[id-1];
            players[id].commands.forEach(cmd => { 
                const span = document.createElement('span'); 
                span.className = 'cmd-block'; 
                span.innerText = symbols[cmd]; 
                span.style.background = conf.color;
                container.appendChild(span); 
            });
        }

        function processMove(id, cmd) {
            let p = players[id];
            if (cmd === 'F' || cmd === 'B') {
                let newX = p.pos.x, newY = p.pos.y;
                let step = (cmd === 'F') ? 1 : -1;
                
                if (p.dir === 0) newX += step;       
                else if (p.dir === 1) newY += step;  
                else if (p.dir === 2) newX -= step;  
                else if (p.dir === 3) newY -= step;  
                
                if (newX >= 0 && newX < gridSize && newY >= 0 && newY < gridSize) { 
                    if (!logicalMap.obstacles.has(`${newX},${newY}`)) {
                        p.pos.x = newX; p.pos.y = newY; 
                    }
                }
            } else if (cmd === 'R') { p.dir = (p.dir + 1) % 4; } 
              else if (cmd === 'L') { p.dir = (p.dir + 3) % 4; }

            let targetIndex = logicalMap.targets[id].findIndex(t => t.x === p.pos.x && t.y === p.pos.y && !t.collected);
            if (targetIndex !== -1) {
                logicalMap.targets[id][targetIndex].collected = true;
                p.score++;
                document.getElementById(`score-${id}`).innerText = `${p.score} / ${totalItemsTarget}`;
                sfxEat();
                
                let cellId = gameMode === 2 ? `cell-shared-${p.pos.x}-${p.pos.y}` : `cell-p${id}-${p.pos.x}-${p.pos.y}`;
                let c = document.getElementById(cellId);
                c.classList.remove(`target-p${id}`);
                c.style.boxShadow = 'inset 0 -4px 0 rgba(0,0,0,0.1)';
                let span = c.querySelector('.target-emoji');
                if(span) span.remove();
            }
        }

        function executeCommands(isTimeout = false) {
            initAudio(); sfxClick();
            if (isExecuting) return; 
            
            let activeIds = getActiveIds();
            let maxSteps = 0;
            activeIds.forEach(id => { if (players[id].commands.length > maxSteps) maxSteps = players[id].commands.length; });

            isExecuting = true; 
            document.getElementById('go-btn').style.opacity = "0.5";
            document.getElementById('go-btn').disabled = true;
            
            if (maxSteps === 0) {
                if (isTimeout) evaluateWin(true);
                else { isExecuting = false; document.getElementById('go-btn').style.opacity = "1"; document.getElementById('go-btn').disabled = false;}
                return;
            }

            let step = 0; 
            const interval = setInterval(() => {
                if (step >= maxSteps) { 
                    clearInterval(interval); 
                    evaluateWin(isTimeout || (initialTimeLimit > 0 && timeLeft <= 0)); 
                    return; 
                }
                sfxMove();
                activeIds.forEach(id => {
                    if (step < players[id].commands.length) processMove(id, players[id].commands[step]);
                });
                drawBees(); step++;
            }, 600); 
        }

        function evaluateWin(timeOutFlag) {
            setTimeout(() => {
                sfxVictory();
                let activeIds = getActiveIds();
                let configs = getPlayerConfigs();

                if (gameMode === '2v2') {
                    let scoreA = players[1].score + players[2].score;
                    let scoreB = players[3].score + players[4].score;
                    let targetTotal = totalItemsTarget * 2;
                    
                    if (scoreA === targetTotal && scoreB === targetTotal) {
                        showModal("¡Empate Perfecto! 🎉", `¡Ambos equipos recolectaron todo!`);
                    } else if (scoreA === targetTotal) {
                        showModal("¡Equipo Azul Gana! 💙", `¡Recolectó los ${targetTotal} elementos primero!`);
                    } else if (scoreB === targetTotal) {
                        showModal("¡Equipo Rojo Gana! ❤️", `¡Recolectó los ${targetTotal} elementos primero!`);
                    } else if (timeOutFlag) {
                        if (scoreA > scoreB) showModal("¡Tiempo Acabado! ⏰\n¡Equipo Azul Gana! 💙", `Eq. Azul: ${scoreA}\nEq. Rojo: ${scoreB}`);
                        else if (scoreB > scoreA) showModal("¡Tiempo Acabado! ⏰\n¡Equipo Rojo Gana! ❤️", `Eq. Rojo: ${scoreB}\nEq. Azul: ${scoreA}`);
                        else showModal("¡Tiempo Acabado! ⏰\n¡Empate! 🤝", `Ambos equipos con ${scoreA} elementos.`);
                    } else {
                        showModal("¡Aún no terminan! 💪", `🔹 Eq. Azul: ${scoreA} / ${targetTotal}\n🔸 Eq. Rojo: ${scoreB} / ${targetTotal}`);
                    }
                } else {
                    let maxScore = -1;
                    activeIds.forEach(id => { if (players[id].score > maxScore) maxScore = players[id].score; });
                    let winners = activeIds.filter(id => players[id].score === maxScore);

                    if (maxScore === totalItemsTarget) {
                        if (winners.length > 1) {
                            let names = winners.map(id=>configs[id-1].name).join(' y ');
                            showModal("¡Empate Perfecto! 🎉", `¡${names} recolectaron todo!`);
                        } else {
                            showModal(`¡${configs[winners[0]-1].name} Gana! 🏆`, `¡Recolectó todo primero!`);
                        }
                    } else if (timeOutFlag) {
                        if (maxScore === 0) {
                            showModal("¡Tiempo Acabado! ⏰", "¡Nadie recolectó nada! ¡Sigan practicando!");
                        } else if (winners.length > 1) {
                            let names = winners.map(id=>configs[id-1].name).join(' y ');
                            showModal("¡Tiempo Acabado! ⏰\n¡Empate! 🤝", `Los equipos ${names} empatan con ${maxScore} elementos.`);
                        } else {
                            showModal(`¡Tiempo Acabado! ⏰\n¡${configs[winners[0]-1].name} Gana! 🏆`, `Logró recolectar ${maxScore} elementos.`);
                        }
                    } else {
                        let msg = "¡Revisen sus comandos y sigan intentando!\n\n";
                        activeIds.forEach(id => { msg += `🔹 ${configs[id-1].name}: ${players[id].score} / ${totalItemsTarget}\n`; });
                        showModal("¡Aún no terminan! 💪", msg);
                    }
                }
                
                document.getElementById('go-btn').style.opacity = "1"; 
                document.getElementById('go-btn').disabled = false;
                isExecuting = false;
            }, 400);
        }

        let modalCallback = null;
        function showModal(title, msg, callback = null) { 
            document.getElementById('m-title').innerText = title; 
            document.getElementById('m-msg').innerText = msg; 
            document.getElementById('modal').classList.add('active'); 
            modalCallback = callback;
        }
        
        function closeModal() { 
            initAudio(); sfxClick();
            document.getElementById('modal').classList.remove('active'); 
            if(modalCallback) { modalCallback(); modalCallback = null; }
        }

        function resetGame() {
            initAudio(); sfxClick();
            
            let activeIds = getActiveIds();
            
            activeIds.forEach(i => {
                players[i] = {
                    score: 0,
                    pos: (gameMode === 2 && i === 2) ? {x: gridSize-1, y: gridSize-1} : {x:0, y:0},
                    dir: (gameMode === 2 && i === 2) ? 2 : 0, 
                    commands: []
                };
            });

            isExecuting = false;
            document.getElementById('go-btn').style.opacity = "1";
            document.getElementById('go-btn').disabled = false;
            
            buildDOM(); 
            generateMapLogic(); 
            populateDOM();
            drawBees();
            
            activeIds.forEach(id => updateSequenceUI(id));
            setupTimer();
        }
        
    </script>
</body>
</html>
