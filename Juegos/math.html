<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Hack: Fusión Matemática ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-color: #02040a;
            --cyber-cyan: #00f3ff;
            --cyber-pink: #ff0055;
            --cyber-yellow: #f1c40f;
            --cyber-green: #39ff14;
            --panel-bg: rgba(17, 24, 39, 0.85);
            --card-bg: #1f2937;
        }

        body, html { 
            font-family: 'Share Tech Mono', monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            margin: 0; padding: 0; width: 100vw; height: 100vh; 
            touch-action: manipulation; color: #fff; background-color: var(--bg-color); 
            overflow: hidden; box-sizing: border-box;
            user-select: none;
        }

        /* EFECTOS DE FONDO CIBERNÉTICO */
        .decorations { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; background: radial-gradient(circle at center, #0a0f24 0%, #000 100%); }
        
        .grid {
            position: absolute; inset: -50%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px; transform: perspective(600px) rotateX(60deg) translateY(-100px); animation: gridMove 8s linear infinite;
        }
        @keyframes gridMove { 0% { transform: perspective(600px) rotateX(60deg) translateY(0); } 100% { transform: perspective(600px) rotateX(60deg) translateY(50px); } }

        /* Lluvia Binaria estilo Matrix de fondo */
        .binary-rain {
            position: absolute; inset: 0; z-index: -1; opacity: 0.15;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,243,255,1) 21px, transparent 22px);
            background-size: 100% 40px; animation: scanDescend 4s linear infinite;
        }
        @keyframes scanDescend { 0% { background-position: 0 -40px; } 100% { background-position: 0 0; } }

        .scanlines {
            position: fixed; inset: 0; z-index: 999; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .sound-toggle { position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--cyber-cyan); border-radius: 4px; width: 45px; height: 45px; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 1000; box-shadow: 0 0 10px rgba(0,243,255,0.3); transition: all 0.2s; color: var(--cyber-cyan); backdrop-filter: blur(5px);}
        .sound-toggle:active { transform: scale(0.9); box-shadow: none; }

        /* LOBBY */
        #setup-screen {
            position: absolute; inset: 0; z-index: 500; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
        }

        .setup-card {
            background: var(--panel-bg); padding: 40px; border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,243,255,0.1), inset 0 0 20px rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); border-top: 4px solid var(--cyber-cyan);
            text-align: center; max-width: 90%; width: 500px; display: flex; flex-direction: column; gap: 20px;
            position: relative; overflow: hidden;
        }
        
        /* Adorno esquina */
        .setup-card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 30px; height: 30px; background: linear-gradient(135deg, transparent 50%, rgba(0,243,255,0.5) 50%);}

        .setup-card h1 { font-size: 50px; color: #fff; margin: 0; text-shadow: 0 0 10px var(--cyber-cyan), 0 0 20px var(--cyber-cyan); letter-spacing: 4px;}
        
        .setup-section { background: rgba(0,243,255,0.05); padding: 20px; border-radius: 4px; border-left: 3px solid var(--cyber-cyan); display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: inset 5px 0 15px rgba(0,243,255,0.1);}
        .setup-section h3 { margin: 0; color: var(--cyber-cyan); font-size: 16px; text-transform: uppercase; letter-spacing: 2px;}
        
        .setup-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;}
        
        .setup-btn { background: #000; border: 1px solid #333; padding: 12px 20px; border-radius: 4px; font-size: 16px; font-weight: bold; color: #888; cursor: pointer; transition: all 0.2s; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; flex: 1; min-width: 120px;}
        .setup-btn:hover { border-color: #555; color: #ccc;}
        .setup-btn.active.diff { background: rgba(0,243,255,0.15); border-color: var(--cyber-cyan); color: #fff; box-shadow: 0 0 15px rgba(0,243,255,0.3); text-shadow: 0 0 5px var(--cyber-cyan);}

        .start-btn {
            background: var(--cyber-cyan); border: none; box-shadow: 0 0 20px rgba(0,243,255,0.4); padding: 15px 40px; font-size: 24px; color: #000; border-radius: 4px; text-transform: uppercase; font-weight: bold; font-family: 'Share Tech Mono', monospace; cursor:pointer; margin-top: 10px; transition: all 0.2s; letter-spacing: 3px; position: relative; overflow: hidden;
        }
        .start-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); transform: skewX(-20deg); transition: 0.5s; }
        .start-btn:hover::before { left: 150%; }
        .start-btn:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(0,243,255,0.3); }

        /* PANTALLA DE JUEGO */
        #game-screen {
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            width: 100vw; height: 100vh; padding: 15px 2vw; box-sizing: border-box; overflow: hidden;
            position: relative;
        }

        .game-header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; z-index: 10; border-bottom: 1px solid rgba(0,243,255,0.3); padding-bottom: 10px;}
        
        .back-menu-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--cyber-pink); padding: 6px 15px; border-radius: 4px; font-size: 14px; color: var(--cyber-pink); cursor: pointer; transition: all 0.2s; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; box-shadow: inset 0 0 10px rgba(255,0,85,0.2);}
        .back-menu-btn:hover { background: rgba(255,0,85,0.2); }
        .back-menu-btn:active { background: var(--cyber-pink); color: #000; }

        .hud-group { display: flex; gap: 15px; align-items: center; }
        .hud-box {
            background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 4px;
            border-left: 3px solid var(--cyber-cyan); font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px;
            box-shadow: inset 5px 0 10px rgba(0,243,255,0.1); backdrop-filter: blur(4px);
        }
        .lives-box { border-color: var(--cyber-green); color: #fff; box-shadow: inset 5px 0 10px rgba(57,255,20,0.1); }
        .lives-box span { color: var(--cyber-green); font-weight: bold;}

        /* ZONA DEL ENEMIGO (TOP) */
        .enemy-zone {
            flex: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,0,85,0.3); border-radius: 8px; margin: 15px 0;
            position: relative; z-index: 10; box-shadow: inset 0 0 50px rgba(255,0,85,0.05); backdrop-filter: blur(2px);
        }

        /* SVG Enemigos */
        .enemy-sprite { width: 120px; height: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--cyber-pink)); animation: float 3s ease-in-out infinite; color: var(--cyber-pink);}
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .enemy-hp-bar { width: 80%; max-width: 400px; height: 8px; background: #111; border-radius: 4px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333;}
        .enemy-hp-fill { height: 100%; width: 100%; background: var(--cyber-pink); transition: width 0.3s; box-shadow: 0 0 10px var(--cyber-pink);}

        .target-node {
            background: rgba(0,0,0,0.8); border: 2px solid var(--cyber-pink); padding: 15px 50px; border-radius: 4px;
            font-size: 45px; font-weight: bold; color: #fff; box-shadow: 0 0 30px rgba(255,0,85,0.3), inset 0 0 20px rgba(255,0,85,0.2);
            text-shadow: 0 0 10px var(--cyber-pink); display: flex; flex-direction: column; align-items: center; position: relative;
        }
        /* Corner details */
        .target-node::before, .target-node::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--cyber-pink); }
        .target-node::before { top: -2px; left: -2px; border-right: none; border-bottom: none;}
        .target-node::after { bottom: -2px; right: -2px; border-left: none; border-top: none;}

        .target-label { font-size: 14px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; text-shadow: none; letter-spacing: 2px;}

        .attack-timer-bar {
            position: absolute; bottom: 0; left: 0; height: 4px; background: var(--cyber-cyan); width: 100%;
            box-shadow: 0 0 10px var(--cyber-cyan); border-radius: 0 0 8px 8px; transition: background 0.3s;
        }
        .attack-timer-bar.critical { background: var(--cyber-red); box-shadow: 0 0 15px var(--cyber-red); animation: pulseDanger 0.5s infinite;}
        @keyframes pulseDanger { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* ZONA DEL JUGADOR (BOTTOM) */
        .player-zone {
            flex: 0 0 auto; width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px;
            z-index: 10; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .cards-container {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; min-height: 100px; perspective: 1000px;
        }

        /* DATA CARDS (CHIPS) */
        .data-card {
            width: clamp(70px, 12vh, 90px); height: clamp(90px, 16vh, 120px);
            background: #0f172a; border: 2px solid #334155; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: clamp(28px, 4vh, 36px); font-weight: bold; color: #fff;
            cursor: pointer; box-shadow: 0 8px 0 #020617, 0 15px 20px rgba(0,0,0,0.5); transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        /* Card circuit lines */
        .data-card::before { content: '||||||'; position: absolute; top: 5px; font-size: 8px; color: #334155; letter-spacing: 2px;}
        .data-card::after { content: '||||||'; position: absolute; bottom: 5px; font-size: 8px; color: #334155; letter-spacing: 2px;}

        .data-card:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
        
        .data-card.selected { 
            border-color: var(--cyber-cyan); background: #082f49; 
            box-shadow: 0 8px 0 #031a2b, 0 20px 30px rgba(0,243,255,0.3), inset 0 0 20px rgba(0,243,255,0.2); 
            color: var(--cyber-cyan); transform: translateY(-15px) rotateX(10deg);
            text-shadow: 0 0 10px var(--cyber-cyan);
        }
        .data-card.selected::before, .data-card.selected::after { color: var(--cyber-cyan); text-shadow: 0 0 5px var(--cyber-cyan);}

        /* OPERATORS */
        .operators-container {
            display: flex; justify-content: center; gap: 15px;
        }
        .op-btn {
            background: #111; border: 2px solid #444; border-radius: 8px;
            width: clamp(50px, 8vh, 60px); height: clamp(50px, 8vh, 60px); font-size: clamp(24px, 4vh, 32px); color: #888;
            cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.1s;
            font-family: 'Share Tech Mono', monospace; box-shadow: 0 6px 0 #000;
        }
        .op-btn:active { transform: translateY(6px); box-shadow: none; }
        .op-btn.selected { 
            border-color: var(--cyber-yellow); color: #fff; 
            box-shadow: 0 6px 0 #785a00, 0 0 20px rgba(241,196,15,0.4); 
            background: rgba(241,196,15,0.15); text-shadow: 0 0 10px var(--cyber-yellow);
        }

        .actions-container {
            display: flex; justify-content: space-between; gap: 15px;
        }
        .action-btn {
            flex: 1; background: #000; border: 1px solid #334155; color: #94a3b8; padding: 12px; border-radius: 4px;
            font-family: 'Share Tech Mono', monospace; font-size: 14px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; font-weight: bold;
        }
        .action-btn:active { transform: scale(0.98); }
        .btn-undo:hover { border-color: var(--cyber-yellow); color: var(--cyber-yellow); background: rgba(241,196,15,0.1);}
        .btn-reset:hover { border-color: var(--cyber-pink); color: var(--cyber-pink); background: rgba(255,0,85,0.1);}

        /* CANVAS PARA ANIMACIONES DE ATAQUE (LASERS, EXPLOSIONES) */
        #fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; mix-blend-mode: screen;}

        @keyframes damageShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }
        .damage-shake { animation: damageShake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--cyber-pink) !important; box-shadow: inset 0 0 80px rgba(255,0,85,0.3) !important;}

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s; backdrop-filter: blur(5px);}
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box { background: var(--panel-bg); padding: 40px; border-radius: 8px; text-align: center; max-width: 85%; width: 450px; transform: scale(0.9); transition: transform 0.3s; border: 1px solid var(--cyber-cyan); box-shadow: 0 0 50px rgba(0,243,255,0.2); border-top: 4px solid var(--cyber-cyan);}
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 32px; margin-top: 0; margin-bottom: 15px; color: #fff; text-shadow: 0 0 10px var(--cyber-cyan);}
        .modal-msg { font-size: 18px; margin-bottom: 25px; color: #cbd5e1; white-space: pre-line; line-height: 1.5; font-family: 'Rajdhani', sans-serif;}
        .modal-btn { background: var(--cyber-cyan); border: none; color: #000; padding: 12px 30px; font-size: 18px; border-radius: 4px; text-transform: uppercase; font-weight: bold; cursor:pointer; transition: all 0.2s; font-family: 'Share Tech Mono', monospace; box-shadow: 0 0 15px rgba(0,243,255,0.4);}
        .modal-btn:hover { filter: brightness(1.2); }
        .modal-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <audio id="bgm" loop><source src="../assets/musicaFondo/cancion1.mp3" type="audio/mpeg"></audio>
    <div class="decorations"><div class="grid"></div><div class="binary-rain"></div><div class="scanlines"></div></div>
    <button id="soundToggle" class="sound-toggle" aria-label="Activar sonido">🔇</button>

    <!-- LOBBY -->
    <div id="setup-screen">
        <div class="setup-card">
            <h1>DATA HACK</h1>
            <p style="margin:0; color:#94a3b8; font-size:14px; font-weight:bold;">> PROTOCOLO DE FUSIÓN MATEMÁTICA_</p>
            
            <div class="setup-section">
                <h3>Nivel de Seguridad</h3>
                <div class="setup-row">
                    <button id="setup-diff-3" class="setup-btn diff active" onclick="selectDiff(3)">Nivel 3 (Fácil)</button>
                    <button id="setup-diff-4" class="setup-btn diff" onclick="selectDiff(4)">Nivel 4 (Normal)</button>
                    <button id="setup-diff-5" class="setup-btn diff" onclick="selectDiff(5)">Nivel 5 (Hacker)</button>
                </div>
            </div>

            <button class="start-btn" onclick="startGame()">INICIAR INCURSIÓN</button>
        </div>
    </div>

    <!-- JUEGO -->
    <div id="game-screen">
        <div class="game-header">
            <button class="back-menu-btn" onclick="backToMenu()">[ ABORTAR ]</button>
            <div class="hud-group">
                <div class="hud-box lives-box">HP: <span id="player-hp-display">100</span>%</div>
                <div class="hud-box">NÚCLEOS: <span id="score-display" style="color:var(--cyber-cyan); font-weight:bold;">0</span>/5</div>
            </div>
        </div>

        <canvas id="fxCanvas"></canvas>

        <div class="enemy-zone" id="enemy-zone">
            <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="enemy-hp-fill"></div></div>
            
            <!-- Contenedor SVG para enemigos generados dinámicamente -->
            <div class="enemy-sprite" id="enemy-sprite"></div>
            
            <div class="target-node">
                <span class="target-label">Código de Ruptura</span>
                <span id="target-display">0</span>
            </div>
            
            <div class="attack-timer-bar" id="attack-timer-bar"></div>
        </div>

        <div class="player-zone">
            <div class="cards-container" id="cards-container">
                <!-- Tarjetas JS -->
            </div>

            <div class="operators-container">
                <button class="op-btn" data-op="+">+</button>
                <button class="op-btn" data-op="-">-</button>
                <button class="op-btn" data-op="*">×</button>
                <button class="op-btn" data-op="/">÷</button>
            </div>

            <div class="actions-container">
                <button class="action-btn btn-undo" onclick="undoMove()">[ Deshacer Paso ]</button>
                <button class="action-btn btn-reset" onclick="resetHand()">[ Reiniciar Mano ]</button>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="m-title">Título</h2>
            <p class="modal-msg" id="m-msg">Mensaje</p>
            <button class="modal-btn" onclick="closeModal()">ACEPTAR</button>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isMuted = true;
        const bgAudio = document.getElementById('bgm');
        const soundToggle = document.getElementById('soundToggle');

        soundToggle.addEventListener('click', () => {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMuted = !isMuted;
            if(isMuted) { bgAudio.pause(); soundToggle.innerText = '🔇'; } 
            else { bgAudio.volume = 0.25; bgAudio.play().catch(e=>e); soundToggle.innerText = '🔊'; }
        });

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx || isMuted) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function sfxClick() { playTone(800, 'square', 0.05, 0.05); }
        function sfxSelect() { playTone(600, 'triangle', 0.08, 0.08); }
        function sfxMerge() { playTone(300, 'square', 0.1, 0.1); setTimeout(()=>playTone(450, 'square', 0.15, 0.1), 50); }
        function sfxShoot() { playTone(1200, 'sawtooth', 0.1, 0.1); setTimeout(()=>playTone(800, 'sawtooth', 0.2, 0.1), 50); }
        function sfxDamage() { playTone(150, 'sawtooth', 0.3, 0.3); setTimeout(()=>playTone(100, 'sawtooth', 0.4, 0.3), 100); }
        function sfxError() { playTone(200, 'sawtooth', 0.2, 0.2); }
        function sfxVictory() { let notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.3, 0.1), i * 150)); }

        let currentDifficulty = 3; 
        let score = 0; let maxScore = 5;
        let playerHp = 100;
        let enemyHp = 100;
        let isGameActive = false;
        
        let initialHand = [];
        let currentHand = [];
        let historyStates = []; 
        let targetNumber = 0;

        let selectedIndex = -1;
        let selectedOp = null;

        let turnTimeMax = 30; 
        let timeLeft = 30;
        let lastTime = 0;
        let animFrameId = null;

        const fxCanvas = document.getElementById('fxCanvas'); const ctx = fxCanvas.getContext('2d');
        
        // SPRITES SVG PARA LOS ENEMIGOS
        const enemySVGs = [
            // Fuego de Datos
            `<svg viewBox="0 0 100 100" fill="currentColor"><path d="M50 0 C60 20 80 40 80 60 C80 80 60 100 50 100 C40 100 20 80 20 60 C20 40 40 20 50 0 Z" opacity="0.8"/><circle cx="50" cy="70" r="15" fill="#000"/></svg>`,
            // Escudo Cuántico
            `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="rgba(255,0,85,0.2)"/><circle cx="50" cy="50" r="20" fill="currentColor"/></svg>`,
            // Ojo Cibernético
            `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"><path d="M5 50 Q50 5 95 50 Q50 95 5 50" fill="rgba(255,0,85,0.2)"/><circle cx="50" cy="50" r="15" fill="currentColor"/></svg>`
        ];

        function resizeCanvas() { fxCanvas.width = fxCanvas.offsetWidth; fxCanvas.height = fxCanvas.offsetHeight; }
        window.addEventListener('resize', resizeCanvas);

        function selectDiff(d) {
            sfxClick(); currentDifficulty = d;
            document.querySelectorAll('.setup-btn.diff').forEach(b => b.classList.remove('active'));
            document.getElementById('setup-diff-' + d).classList.add('active');
        }

        function startGame() {
            if (!audioCtx && !isMuted) { audioCtx = new AudioContext(); bgAudio.play().catch(e=>e); }
            sfxClick();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            resizeCanvas();
            score = 0; playerHp = 100; enemyHp = 100;
            document.getElementById('score-display').innerText = score;
            updateHpBars();
            nextEnemy();
            
            lastTime = performance.now();
            cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function backToMenu() {
            sfxClick(); isGameActive = false; cancelAnimationFrame(animFrameId);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        function generatePuzzle(numCards) {
            let maxVal = numCards === 3 ? 10 : (numCards === 4 ? 15 : 20);
            let cards = [];
            for(let i=0; i<numCards; i++) cards.push(Math.floor(Math.random() * maxVal) + 1);

            let temp = [...cards];
            while(temp.length > 1) {
                let i1 = Math.floor(Math.random() * temp.length);
                let val1 = temp.splice(i1, 1)[0];
                let i2 = Math.floor(Math.random() * temp.length);
                let val2 = temp.splice(i2, 1)[0];

                let ops = ['+', '-', '*'];
                if (val1 % val2 === 0 && val2 !== 0) ops.push('/1');
                if (val2 % val1 === 0 && val1 !== 0) ops.push('/2');

                let op = ops[Math.floor(Math.random() * ops.length)];
                let res = 0;
                
                if (op === '+') res = val1 + val2;
                else if (op === '-') res = Math.abs(val1 - val2); 
                else if (op === '*') res = val1 * val2;
                else if (op === '/1') res = val1 / val2;
                else if (op === '/2') res = val2 / val1;

                temp.push(res);
            }
            return { target: temp[0], hand: cards };
        }

        function nextEnemy() {
            let puzzle = generatePuzzle(currentDifficulty);
            targetNumber = puzzle.target;
            initialHand = [...puzzle.hand];
            currentHand = [...puzzle.hand];
            historyStates = [];
            
            document.getElementById('enemy-sprite').innerHTML = enemySVGs[score % enemySVGs.length];
            document.getElementById('target-display').innerText = targetNumber;
            
            turnTimeMax = currentDifficulty === 3 ? 30 : (currentDifficulty === 4 ? 45 : 60);
            timeLeft = turnTimeMax;
            enemyHp = 100;
            updateHpBars();
            
            clearSelection();
            renderHand();
            isGameActive = true;
        }

        function renderHand() {
            let container = document.getElementById('cards-container');
            container.innerHTML = '';
            currentHand.forEach((num, index) => {
                let card = document.createElement('div');
                card.className = `data-card ${index === selectedIndex ? 'selected' : ''}`;
                card.innerText = num;
                card.onclick = () => selectCard(index);
                container.appendChild(card);
            });
            
            document.querySelectorAll('.op-btn').forEach(btn => {
                if (btn.dataset.op === selectedOp) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        }

        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.onclick = () => {
                if (!isGameActive) return;
                sfxSelect();
                if (selectedIndex !== -1) {
                    selectedOp = btn.dataset.op;
                    renderHand();
                } else {
                    sfxError(); 
                }
            };
        });

        function selectCard(index) {
            if (!isGameActive) return;
            sfxSelect();
            
            if (selectedIndex === -1) {
                selectedIndex = index;
                renderHand();
            } else if (selectedIndex === index) {
                clearSelection();
                renderHand();
            } else {
                if (selectedOp) {
                    executeMerge(selectedIndex, index, selectedOp);
                } else {
                    selectedIndex = index;
                    renderHand();
                }
            }
        }

        function clearSelection() {
            selectedIndex = -1;
            selectedOp = null;
        }

        function executeMerge(i1, i2, op) {
            let val1 = currentHand[i1];
            let val2 = currentHand[i2];
            let res = 0;

            if (op === '+') res = val1 + val2;
            else if (op === '-') res = val1 - val2;
            else if (op === '*') res = val1 * val2;
            else if (op === '/') {
                if (val2 === 0 || val1 % val2 !== 0) {
                    sfxError();
                    createFloatingText("División Inexacta", '#ff0055');
                    clearSelection();
                    renderHand();
                    return;
                }
                res = val1 / val2;
            }

            sfxMerge();
            historyStates.push([...currentHand]);

            let newHand = [];
            for(let i=0; i<currentHand.length; i++) {
                if (i !== i1 && i !== i2) newHand.push(currentHand[i]);
            }
            newHand.push(res);
            currentHand = newHand;

            clearSelection();
            renderHand();
            checkCombat();
        }

        function undoMove() {
            if (!isGameActive || historyStates.length === 0) { sfxError(); return; }
            sfxSelect();
            currentHand = historyStates.pop();
            clearSelection();
            renderHand();
        }

        function resetHand() {
            if (!isGameActive || historyStates.length === 0) { sfxError(); return; }
            sfxSelect();
            currentHand = [...initialHand];
            historyStates = [];
            clearSelection();
            renderHand();
        }

        function checkCombat() {
            if (currentHand.includes(targetNumber)) {
                isGameActive = false; 
                sfxShoot();
                shootLaser();
                
                enemyHp -= 100; 
                updateHpBars();

                setTimeout(() => {
                    score++;
                    document.getElementById('score-display').innerText = score;
                    if (score >= maxScore) {
                        sfxVictory();
                        document.getElementById('m-title').style.color = "var(--cyber-cyan)";
                        showModal("¡ACCESO CONCEDIDO! 🔓", `Hackeo completo. El sistema ha sido vulnerado con éxito.`, backToMenu);
                    } else {
                        nextEnemy();
                    }
                }, 1000);
            } else if (currentHand.length === 1 && currentHand[0] !== targetNumber) {
                sfxError();
                createFloatingText("Secuencia Errónea", '#ff0055');
                setTimeout(() => resetHand(), 800);
            }
        }

        function takeDamage() {
            sfxDamage();
            playerHp -= 25;
            updateHpBars();
            document.getElementById('enemy-zone').classList.remove('damage-shake');
            document.body.classList.remove('damage-shake');
            void document.body.offsetWidth;
            document.body.classList.add('damage-shake');

            createFloatingText("¡ATAQUE ENEMIGO!", '#ff0055');

            if (playerHp <= 0) {
                isGameActive = false;
                document.getElementById('m-title').style.color = "var(--cyber-pink)";
                showModal("¡CONEXIÓN CORTADA! 💥", `Tus defensas colapsaron. El firewall te ha expulsado.`, backToMenu);
            } else {
                timeLeft = turnTimeMax; 
            }
        }

        function updateHpBars() {
            document.getElementById('player-hp-display').innerText = Math.max(0, playerHp);
            document.getElementById('enemy-hp-fill').style.width = Math.max(0, enemyHp) + '%';
        }

        // EFECTOS VISUALES EN CANVAS (LASERS Y PARTICULAS)
        let particles = [];
        let lasers = [];

        class Particle {
            constructor(x,y,c) { this.x=x; this.y=y; this.c=c; this.life=1; this.vx=(Math.random()-0.5)*20; this.vy=(Math.random()-0.5)*20; this.size=Math.random()*6+3;}
            update() { this.x+=this.vx; this.y+=this.vy; this.life-=0.03; this.size*=0.95;}
            draw(ctx) { ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.c; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha=1; ctx.shadowBlur=10; ctx.shadowColor=this.c;}
        }

        class FloatingText {
            constructor(txt, c) { this.x=fxCanvas.width/2; this.y=fxCanvas.height/2; this.txt=txt; this.c=c; this.life=1; this.vy=-2; }
            update() { this.y+=this.vy; this.life-=0.02; }
            draw(ctx) { ctx.globalAlpha=Math.max(0,this.life); ctx.fillStyle=this.c; ctx.font="bold 30px 'Share Tech Mono'"; ctx.textAlign="center"; ctx.shadowBlur=15; ctx.shadowColor=this.c; ctx.fillText(this.txt,this.x,this.y); ctx.shadowBlur=0; ctx.globalAlpha=1; }
        }

        function createBurst(x,y,c) { for(let i=0; i<30; i++) particles.push(new Particle(x,y,c)); }
        function createFloatingText(txt,c) { particles.push(new FloatingText(txt,c)); }

        function shootLaser() {
            lasers.push({ x1: fxCanvas.width/2, y1: fxCanvas.height, x2: fxCanvas.width/2, y2: fxCanvas.height * 0.25, life: 1.0 });
            createBurst(fxCanvas.width/2, fxCanvas.height * 0.25, '#00f3ff');
        }

        function gameLoop(ts) {
            animFrameId = requestAnimationFrame(gameLoop);
            if (!isGameActive) return;

            let dt = (ts - lastTime) / 1000;
            lastTime = ts;

            timeLeft -= dt;
            if (timeLeft <= 0) {
                takeDamage();
            }
            
            let timerPercent = Math.max(0, (timeLeft / turnTimeMax) * 100);
            let bar = document.getElementById('attack-timer-bar');
            bar.style.width = timerPercent + '%';
            
            if (timeLeft < 5) {
                bar.classList.add('critical');
            } else {
                bar.classList.remove('critical');
                bar.style.background = 'var(--cyber-cyan)';
            }

            ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

            for(let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                
                // Glow exterior
                ctx.strokeStyle = `rgba(0, 243, 255, ${l.life})`;
                ctx.lineWidth = 25 * l.life;
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                
                // Núcleo interior
                ctx.strokeStyle = `rgba(255, 255, 255, ${l.life})`;
                ctx.lineWidth = 8 * l.life;
                ctx.stroke();

                l.life -= 0.08; // Vida láser
                if(l.life <= 0) lasers.splice(i, 1);
            }

            for(let i=particles.length-1; i>=0; i--) { 
                particles[i].update(); 
                particles[i].draw(ctx); 
                if(particles[i].life<=0) particles.splice(i,1); 
            }
        }

        let modalCallback = null;
        function showModal(title, msg, callback = null) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-msg').innerText = msg;
            document.getElementById('modal').classList.add('active');
            modalCallback = callback;
        }

        function closeModal() {
            sfxClick();
            document.getElementById('modal').classList.remove('active');
            if (modalCallback) { modalCallback(); modalCallback = null; }
        }
    </script>
</body>
</html>
