<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#40261d"><title>Biblioteca de historias</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/controles.css"></head>
<body><main class="library">
<div class="vignette" aria-hidden="true"></div>
<header class="header"><span class="eyebrow">Un rincón para descubrir</span><h1>Biblioteca de <em>Historias</em></h1><p>Elige un libro y descubre una nueva aventura</p><span id="collectionCount" class="collection-count"></span></header>
<section class="carousel-stage" aria-label="Historias de la biblioteca" aria-roledescription="carrusel" tabindex="0"><div class="bookcase"><div class="floor-shadow" aria-hidden="true"></div><img class="shelf-art" src="assets/estanteria-detalle.png" alt=""><button id="carouselPrev" class="carousel-arrow previous" type="button" aria-label="Ver historia anterior">‹</button><div class="books" id="books"></div><button id="carouselNext" class="carousel-arrow following" type="button" aria-label="Ver historia siguiente">›</button><div class="carousel-pagination" id="carouselPagination" aria-label="Elegir historia"></div></div></section>
<footer class="collection-footer"><p class="hint" id="carouselStatus" role="status" aria-live="polite"></p><div class="library-controls"><span class="control-note">Una melodía para cada aventura</span><div id="musicControls"></div></div></footer>
</main>
<dialog id="detail" aria-labelledby="modal-title"><button class="close" aria-label="Cerrar" type="button">×</button><div class="modal-inner"><div id="modal-cover-holder"></div><div class="modal-text"><div class="modal-eyebrow" id="modal-kicker"></div><h2 id="modal-title"></h2><p id="modal-description"></p><div id="modal-status"></div><button class="primary" id="modal-action" type="button">Entendido</button></div></div></dialog>
<audio id="bgm" loop preload="metadata"></audio><script src="js/sonidos.js"></script><script src="js/audio-comun.js"></script><script src="js/catalogo.js"></script><script src="js/main.js"></script></body></html>
