<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚲 El Cartero ABC 📬</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #60c9ff;
            --sky-bottom: #d4f1ff;
            --grass: #82e0aa;
            --grass-dark: #58d68d;
            --font-main: 'Fredoka', sans-serif;
            --path-color: #f1d3a1;
            --path-border: #dfbb80;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }

        /* PAISAJE DE CUENTO */
        .decorations { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;}
        .sun { position: absolute; top: 5%; left: 5%; font-size: 90px; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); animation: spinSun 20s linear infinite; }
        @keyframes spinSun { 100% { transform: rotate(360deg); } }
        
        .cloud { position: absolute; font-size: 60px; filter: drop-shadow(3px 3px 0 rgba(255,255,255,0.8)); animation: floatCloud linear infinite; opacity: 0.9; }
        .c1 { top: 10%; animation-duration: 40s; font-size: 80px; }
        .c2 { top: 25%; animation-duration: 35s; animation-delay: -15s; font-size: 50px; }
        .c3 { top: 8%; animation-duration: 50s; animation-delay: -25s; font-size: 70px; }
        @keyframes floatCloud { 0% { left: -20%; } 100% { left: 120%; } }

        .hills { position: absolute; bottom: -5vh; left: -10vw; width: 120vw; height: 45vh; background: var(--grass); border-radius: 50% 50% 0 0; box-shadow: inset 0 20px 0 var(--grass-dark), 0 -30px 50px rgba(0,0,0,0.1); }
        .hills-back { position: absolute; bottom: 15vh; left: -20vw; width: 140vw; height: 40vh; background: #abebc6; border-radius: 50% 50% 0 0; z-index: -1; }

        /* CABECERA Y UI INFANTIL */
        h1 {
            color: #fff;
            margin: 15px 0 5px 0;
            font-size: 40px;
            text-shadow: 3px 3px 0px #ff9800, 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            letter-spacing: 2px;
            z-index: 10;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 22px;
            color: #d35400;
            box-shadow: 0 8px 0 #f39c12;
            margin-bottom: 10px;
            z-index: 10;
            border: 4px solid #f39c12;
        }

        .status-item { display: flex; align-items: center; gap: 8px; font-weight: 700; }

        /* BOTÓN DE SONIDO (Alineado a la Izquierda) */
        .sound-btn {
            position: fixed;
            top: 20px;
            left: 20px; /* Cambiado de right a left */
            width: 60px;
            height: 60px;
            background: #fff;
            border: 4px solid #f39c12;
            border-radius: 50%;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #f39c12;
            z-index: 50;
            transition: transform 0.1s;
        }
        .sound-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #f39c12; }

        /* ZONA DE JUEGO PRINCIPAL */
        .game-area {
            position: relative;
            width: 100%;
            max-width: 950px; 
            height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 10;
        }

        /* CUADRA ISOMÉTRICA (PERFECTAMENTE SIMÉTRICA) */
        .city-block {
            position: relative;
            width: 100%;
            height: 350px; 
            margin-bottom: 20px;
        }

        /* Calle Principal Curvada */
        .main-street {
            position: absolute;
            top: 180px; 
            left: -10vw;
            width: 120vw;
            height: 90px;
            background: var(--path-color);
            border-top: 6px solid var(--path-border);
            border-bottom: 6px solid var(--path-border);
            border-radius: 50%; 
            z-index: 10; 
        }

        .house {
            position: absolute;
            width: 200px;
            height: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            background-size: contain;
            background-position: bottom center;
            background-repeat: no-repeat;
            transform: scale(var(--base-scale, 1));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .house.h1 { background-image: url('../assets/Casa1.png'); }
        .house.h2 { background-image: url('../assets/Casa2.png'); }
        .house.h3 { background-image: url('../assets/Casa3.png'); }
        .house.h4 { background-image: url('../assets/Casa4.png'); }

        /* BUZÓN LATERAL */
        .mailbox {
            position: absolute;
            bottom: 20px; 
            right: -25px; 
            background: #fff;
            border: 4px solid #333;
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 900;
            color: #2c3e50;
            box-shadow: 0 6px 0 #333;
            z-index: 2;
            font-family: 'Nunito', sans-serif;
        }

        /* Poste del buzón clavado en el piso */
        .mailbox::before {
            content: '';
            position: absolute;
            bottom: -30px; 
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 35px;
            background: #8d6e63;
            border: 3px solid #4e342e;
            border-top: none;
            z-index: -1;
            border-radius: 0 0 5px 5px;
        }

        .house.happy {
            transform: translateY(-20px) scale(calc(var(--base-scale, 1) * 1.05));
            filter: drop-shadow(0 15px 15px rgba(255,255,255,0.6));
        }

        /* ANIMACIÓN DINÁMICA DEL CARTERO Y SU BICICLETA FIJA */
        #mailman-container {
            position: absolute;
            width: 100px;
            height: 120px;
            z-index: 50; 
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.3));
            transition: left 1.5s ease-in-out, top 1.5s ease-in-out, transform 0.3s ease;
        }

        .mailman-bounce {
            position: relative;
            width: 100%;
            height: 100%;
            animation: bounceRide 0.4s infinite alternate;
        }

        /* El osito anclado firmemente al asiento */
        .mailman-rider {
            position: absolute;
            font-size: 60px;
            bottom: 40px; /* Lo sienta exactamente en la bici */
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* La bicicleta */
        .mailman-bike {
            position: absolute;
            font-size: 80px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        @keyframes bounceRide {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* BOLSA DEL CARTERO (SOBRES CENTRADOS) */
        .postal-zone {
            height: 140px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px dashed #4dabf7;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
            margin: 0 10px 10px 10px;
            z-index: 100; 
        }

        .postal-zone-title {
            position: absolute;
            top: -20px;
            background: #4dabf7;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: 0 4px 0 #1864ab;
        }

        .envelope {
            width: 90px;
            height: 70px;
            background: #fff3bf;
            border: 4px solid #f08c00;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: 900;
            color: #d9480f;
            cursor: grab;
            box-shadow: 0 8px 0 #e67700, 0 15px 20px rgba(0,0,0,0.2);
            position: absolute;
            z-index: 100;
            font-family: 'Nunito', sans-serif;
            animation: gentleBounce 2s infinite alternate;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            border-bottom: 3px solid rgba(240, 140, 0, 0.3);
            border-radius: 5px 5px 50% 50%;
            pointer-events: none;
        }

        @keyframes gentleBounce {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        .envelope.dragging {
            animation: none;
            cursor: grabbing;
            transform: scale(1.1) rotate(0deg) !important;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            z-index: 9999 !important; 
        }

        /* MODAL DE VICTORIA INFANTIL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: #fff; padding: 40px; border-radius: 40px; text-align: center;
            max-width: 90%; transform: scale(0.5) rotate(-10deg); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 8px solid #ff9800;
        }
        .modal-overlay.active .modal-box { transform: scale(1) rotate(0deg); }
        .modal-title { font-size: 40px; margin-bottom: 10px; color: #f57c00; text-shadow: 2px 2px 0 #fff; }
        
        .modal-btn {
            background: #51cf66; border: 4px solid #fff; padding: 15px 40px;
            font-size: 24px; color: white; border-radius: 30px; font-weight: 900;
            cursor: pointer; box-shadow: 0 8px 0 #2b8a3e; margin-top: 20px;
            font-family: var(--font-main);
        }
        .modal-btn:active { transform: translateY(8px); box-shadow: none; }

        /* PARTICULAS (Estrellitas) */
        .sparkle {
            position: absolute; font-size: 40px; pointer-events: none; z-index: 100;
            animation: popOut 0.8s ease-out forwards;
        }
        @keyframes popOut {
            0% { transform: scale(0) translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)) rotate(180deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA DE FONDO (MÁS DIVERTIDA Y CÓMICA PARA NIÑOS) -->
    <audio id="bgm" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_24db8867dd.mp3?filename=funny-kids-123491.mp3" type="audio/mpeg">
    </audio>

    <div class="decorations">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="cloud c3">☁️</div>
        <div class="hills-back"></div>
        <div class="hills"></div>
    </div>

    <!-- BOTÓN DE SONIDO (Alineado a la izquierda) -->
    <div class="sound-btn" id="soundBtn" onclick="toggleSound()">🔇</div>

    <h1>🚲 El Cartero ABC 📬</h1>
    
    <div class="status-bar">
        <div class="status-item">Ronda: <span id="street-num">⭐</span></div>
        <div class="status-item">Cartas: <span id="letters-left-icons">✉️✉️✉️✉️</span></div>
    </div>

    <div class="game-area">
        
        <!-- Cuadra Isométrica Simétrica -->
        <div class="city-block" id="city-block">
            <div class="main-street"></div>
            
            <div id="mailman-container">
                <div class="mailman-bounce">
                    <span class="mailman-rider">🐻</span>
                    <span class="mailman-bike">🚲</span>
                </div>
            </div>
            <!-- Casas inyectadas por JS -->
        </div>

        <div class="postal-zone" id="postal-zone">
            <div class="postal-zone-title">🎒 Bolsa del cartero</div>
            <!-- Los sobres se generan aquí -->
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div style="font-size: 80px; margin-bottom: -20px;">🎉🐻</div>
            <h2 class="modal-title" id="m-title">¡Súper Bien!</h2>
            <p style="font-size: 22px; color: #555; font-weight: bold; margin-bottom: 25px;">Repartiste todas las cartas de esta cuadra.</p>
            <button class="modal-btn" onclick="nextStreet()">Siguiente Cuadra ➔</button>
        </div>
    </div>

    <script>
        // ==========================================
        // MOTOR DE SONIDO (WEB AUDIO API)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let soundEnabled = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function sfxPickup() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function sfxCorrect() {
            playTone(523.25, 'triangle', 0.2, 0.15); 
            setTimeout(() => playTone(659.25, 'triangle', 0.3, 0.15), 100); 
        }

        function sfxWrong() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function sfxBicycleBell() {
            if (!soundEnabled || !audioCtx) return;
            playTone(1046.50, 'sine', 0.1, 0.1); 
            setTimeout(() => playTone(1318.51, 'sine', 0.15, 0.1), 150); 
        }

        function sfxVictory() {
            let notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.3, 0.05), i * 150);
            });
        }

        function toggleSound() {
            initAudio();
            const bgm = document.getElementById('bgm');
            soundEnabled = !soundEnabled;
            
            if (soundEnabled) {
                document.getElementById('soundBtn').innerText = '🔊';
                bgm.volume = 0.2; 
                bgm.play().catch(e => console.log("Bloqueo autoplay"));
            } else {
                document.getElementById('soundBtn').innerText = '🔇';
                bgm.pause();
            }
        }

        // ==========================================
        // LÓGICA DEL JUEGO
        // ==========================================
        const levelsData = [
            { pairs: [{upper: 'A', lower: 'a'}, {upper: 'E', lower: 'e'}, {upper: 'I', lower: 'i'}, {upper: 'O', lower: 'o'}] }, 
            { pairs: [{upper: 'B', lower: 'b'}, {upper: 'D', lower: 'd'}, {upper: 'P', lower: 'p'}, {upper: 'Q', lower: 'q'}] }, 
            { pairs: [{upper: 'M', lower: 'm'}, {upper: 'N', lower: 'n'}, {upper: 'U', lower: 'u'}, {upper: 'V', lower: 'v'}] }, 
            { pairs: [{upper: 'C', lower: 'c'}, {upper: 'S', lower: 's'}, {upper: 'Z', lower: 'z'}, {upper: 'X', lower: 'x'}] }, 
            { pairs: [{upper: 'F', lower: 'f'}, {upper: 'G', lower: 'g'}, {upper: 'R', lower: 'r'}, {upper: 'J', lower: 'j'}] }
        ];

        // Distribución porcentual matemática para simetría perfecta
        const isometricLayout = [
            { left: '25%', top: '0%', z: 15, scale: 0.85 },   // Atrás Izq
            { left: '54%', top: '0%', z: 15, scale: 0.85 },   // Atrás Der
            { left: '10%', top: '32%', z: 30, scale: 1.1 },   // Adelante Izq
            { left: '69%', top: '32%', z: 30, scale: 1.1 }    // Adelante Der
        ];

        let currentStreet = 0;
        let activePairs = [];
        let remainingLetters = 0;

        const cityBlock = document.getElementById('city-block');
        const postalZone = document.getElementById('postal-zone');
        const mailman = document.getElementById('mailman-container');

        function initStreet() {
            Array.from(cityBlock.children).forEach(c => {
                if(c.id !== 'mailman-container' && !c.classList.contains('main-street')) c.remove();
            });

            Array.from(postalZone.children).forEach(c => {
                if(!c.classList.contains('postal-zone-title')) c.remove();
            });

            document.getElementById('street-num').innerText = '⭐'.repeat((currentStreet % 5) + 1);
            
            let levelInfo = levelsData[currentStreet % levelsData.length];
            activePairs = [...levelInfo.pairs];
            remainingLetters = activePairs.length;
            
            updateLetterIcons();

            // Reposicionar al cartero
            mailman.style.transition = 'none';
            mailman.style.left = '-150px';
            mailman.style.top = '140px';
            mailman.style.transform = 'scaleX(1) scaleY(1)';
            setTimeout(() => mailman.style.transition = 'left 1.5s ease-in-out, top 1.5s ease-in-out, transform 0.3s ease', 50);

            // Generar 4 Casas
            let shuffledHouses = [...activePairs].sort(() => Math.random() - 0.5);
            shuffledHouses.forEach((pair, index) => {
                let house = document.createElement('div');
                house.className = `house h${index + 1}`;
                house.dataset.letter = pair.upper;
                
                let pos = isometricLayout[index];
                house.style.setProperty('--base-scale', pos.scale);
                house.style.left = pos.left;
                house.style.top = pos.top;
                house.style.zIndex = pos.z;

                let mailbox = document.createElement('div');
                mailbox.className = 'mailbox';
                mailbox.innerText = pair.upper;

                house.appendChild(mailbox);
                cityBlock.appendChild(house);
            });

            // Generar Sobres centrados en la bolsa
            let shuffledEnvelopes = [...activePairs].sort(() => Math.random() - 0.5);
            shuffledEnvelopes.forEach((pair, index) => {
                let env = document.createElement('div');
                env.className = 'envelope';
                env.innerText = pair.lower;
                env.dataset.letter = pair.lower;
                env.dataset.match = pair.upper;

                let spacing = 110;
                let startX = (postalZone.offsetWidth / 2) - ((shuffledEnvelopes.length * spacing) / 2) + (index * spacing);
                env.style.left = Math.max(10, startX) + 'px';
                env.style.top = '40px';

                makeDraggable(env);
                postalZone.appendChild(env);
            });
        }

        function updateLetterIcons() {
            document.getElementById('letters-left-icons').innerText = '✉️'.repeat(remainingLetters) || '✅';
        }

        function createSparkles(x, y) {
            const emojis = ['✨', '⭐', '🎊', '🎈'];
            for(let i=0; i<8; i++) {
                let spark = document.createElement('div');
                spark.className = 'sparkle';
                spark.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                
                let tx = (Math.random() - 0.5) * 200 + 'px';
                let ty = (Math.random() - 0.5) * 200 + 'px';
                spark.style.setProperty('--tx', tx);
                spark.style.setProperty('--ty', ty);
                
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 800);
            }
        }

        // ARRASTRE Y SOLTAR 
        function makeDraggable(elm) {
            let posX = 0, posY = 0, startLeft = 0, startTop = 0;

            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                initAudio(); 
                sfxPickup(); 
                
                e.preventDefault();
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;

                startLeft = elm.offsetLeft;
                startTop = elm.offsetTop;
                posX = clientX;
                posY = clientY;

                elm.classList.add('dragging');

                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
            }

            function elementDrag(e) {
                e.preventDefault();
                let clientX = e.clientX || e.touches[0].clientX;
                let clientY = e.clientY || e.touches[0].clientY;

                let deltaX = clientX - posX;
                let deltaY = clientY - posY;

                elm.style.left = (startLeft + deltaX) + 'px';
                elm.style.top = (startTop + deltaY) + 'px';
            }

            function closeDragElement() {
                document.onmousemove = null;
                document.ontouchmove = null;
                document.onmouseup = null;
                document.ontouchend = null;

                elm.classList.remove('dragging');

                let envRect = elm.getBoundingClientRect();
                let matched = false;
                let tolerance = 30;

                document.querySelectorAll('.house').forEach((house, index) => {
                    let houseRect = house.getBoundingClientRect();

                    if (
                        envRect.left < houseRect.right + tolerance &&
                        envRect.right > houseRect.left - tolerance &&
                        envRect.top < houseRect.bottom + tolerance &&
                        envRect.bottom > houseRect.top - tolerance
                    ) {
                        if (house.dataset.letter === elm.dataset.match) {
                            matched = true;
                            sfxCorrect(); 
                            elm.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                            
                            elm.style.left = (house.offsetLeft + house.offsetWidth - 20) + 'px'; 
                            elm.style.top = (house.offsetTop + house.offsetHeight - 50) + 'px';
                            elm.style.transform = 'scale(0.2)';
                            elm.style.opacity = '0';
                            
                            house.classList.add('happy');
                            createSparkles(houseRect.right - 10, houseRect.bottom - 40);

                            // Mover el cartero
                            let currentMailmanX = parseInt(mailman.style.left || -150);
                            let targetMailmanX = house.offsetLeft - 30; 
                            let targetMailmanY = house.offsetTop + 110; 
                            
                            let posScale = isometricLayout[index].scale;
                            let direction = targetMailmanX < currentMailmanX ? -1 : 1;
                            
                            mailman.style.transform = `scaleX(${direction * posScale}) scaleY(${posScale})`;
                            mailman.style.left = targetMailmanX + 'px';
                            mailman.style.top = targetMailmanY + 'px';
                            
                            let zModifier = index >= 2 ? 5 : 5;
                            mailman.style.zIndex = parseInt(house.style.zIndex) + zModifier; 

                            setTimeout(() => sfxBicycleBell(), 600); 

                            setTimeout(() => {
                                elm.remove();
                                house.classList.remove('happy');
                            }, 400);

                            remainingLetters--;
                            updateLetterIcons();

                            if (remainingLetters === 0) {
                                setTimeout(() => {
                                    // Cartero sale de la pantalla
                                    mailman.style.transform = `scaleX(1) scaleY(1)`;
                                    mailman.style.left = '120%';
                                    
                                    setTimeout(() => {
                                        sfxVictory();
                                        document.getElementById('modal').classList.add('active');
                                    }, 1500);

                                }, 1500); 
                            }
                        }
                    }
                });

                if (!matched) {
                    sfxWrong(); 
                    elm.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    elm.style.left = startLeft + 'px';
                    elm.style.top = startTop + 'px';
                    setTimeout(() => elm.style.transition = 'none', 400);
                }
            }
        }

        function nextStreet() {
            document.getElementById('modal').classList.remove('active');
            currentStreet++;
            setTimeout(initStreet, 300);
        }

        initStreet();
    </script>
</body>
</html>
