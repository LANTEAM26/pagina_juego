<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧪 Lanzador Iónico | Química</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --lab-bg: #0b0f19;
            --lab-acid: #39ff14;
            --lab-purple: #b339ff;
            --lab-cyan: #00f3ff;
            --font-title: 'Fredoka', sans-serif;
            --font-text: 'Nunito', sans-serif;
        }

        body {
            font-family: var(--font-text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin: 0; padding: 15px; min-height: 100vh; touch-action: none; color: #fff;
            background-color: var(--lab-bg); overflow: hidden;
        }

        /* FONDO DEL LABORATORIO TECNOLÓGICO */
        .lab-background { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at center, #161a29 0%, var(--lab-bg) 100%); overflow: hidden;}
        
        .tube { position: absolute; bottom: 0; height: 100vh; background: linear-gradient(90deg, rgba(57,255,20,0.02) 0%, rgba(57,255,20,0.1) 50%, rgba(57,255,20,0.02) 100%); border-left: 1px solid rgba(57,255,20,0.2); border-right: 1px solid rgba(57,255,20,0.2); box-shadow: 0 0 20px rgba(57,255,20,0.1);}
        .tube-1 { left: 8%; width: 50px;} .tube-2 { right: 12%; width: 70px; } .tube-3 { left: 25%; width: 35px; opacity: 0.6;}

        .bubble-bg { position: absolute; bottom: -20px; background: rgba(57, 255, 20, 0.4); border-radius: 50%; animation: floatUp linear infinite; box-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* PANELES SUPERIORES GLASSMORPHISM */
        .top-ui-container {
            display: flex; flex-direction: column; width: 100%; max-width: 900px; z-index: 10; gap: 10px; margin-bottom: 10px;
        }

        .header-row {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }

        h1 { color: #fff; margin: 0; font-size: 26px; font-family: var(--font-title); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--lab-acid); display: flex; align-items: center; gap: 10px;}
        .level-badge { background: rgba(179, 57, 255, 0.2); color: #fff; padding: 6px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; font-family: var(--font-title); box-shadow: inset 0 0 10px rgba(179, 57, 255, 0.5), 0 0 10px rgba(179, 57, 255, 0.3); border: 2px solid var(--lab-purple);}

        .difficulty-selector { display: flex; gap: 10px; justify-content: center; }
        .diff-btn { background: rgba(11, 15, 25, 0.8); border: 2px solid #334; padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #889; cursor: pointer; transition: all 0.2s; font-family: var(--font-title); text-transform: uppercase; letter-spacing: 1px;}
        .diff-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--lab-cyan); color: #fff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2); transform: translateY(-2px); text-shadow: 0 0 5px var(--lab-cyan);}

        .prompt-box {
            display: flex; justify-content: space-between; align-items: center; background: rgba(16, 22, 36, 0.75); padding: 12px 25px; border-radius: 18px; width: 100%; box-sizing: border-box; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(57, 255, 20, 0.4); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        .compound-info { display: flex; flex-direction: column; }
        .compound-label { color: #889; font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; margin-bottom: 2px;}
        
        /* Animación de pulso para llamar la atención */
        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(57, 255, 20, 0.6); transform: scale(1); }
            50% { text-shadow: 0 0 20px var(--lab-acid), 0 0 30px var(--lab-acid); transform: scale(1.02); }
        }
        .compound-name { color: var(--lab-acid); font-size: 24px; font-family: var(--font-title); font-weight: 700; letter-spacing: 1px; animation: pulseGlow 2.5s infinite; transform-origin: left center;}
        
        .progress-tracker { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 20px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .progress-tracker span:first-child { color: #889; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;}
        .progress-tracker #atoms-left { color: var(--lab-cyan); font-size: 26px; font-family: var(--font-title); font-weight: 700; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8); line-height: 1.1;}

        /* CANVAS AREA CON EFECTO SHAKE */
        .canvas-container {
            position: relative; width: 100%; max-width: 900px; background: rgba(5, 8, 15, 0.6); border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; backdrop-filter: blur(4px);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-1deg); }
            40%, 80% { transform: translateX(8px) rotate(1deg); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #e74c3c !important; box-shadow: 0 0 30px rgba(231, 76, 60, 0.6) !important;}

        #gameCanvas { display: block; width: 100%; height: auto; border-radius: 18px; cursor: crosshair; }

        /* CONTROLES INFERIORES */
        .controls { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 900px; margin-top: 15px; z-index: 10; }
        .btn { font-family: var(--font-title); font-weight: 700; font-size: 15px; padding: 12px 30px; border: none; border-radius: 12px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; color: #fff; letter-spacing: 1px;}
        .btn:active { transform: translateY(4px); box-shadow: none !important; }
        
        .btn-reset { background: rgba(255,255,255,0.1); box-shadow: 0 6px 0 rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);}
        .btn-reset:hover { background: rgba(255,255,255,0.2); }
        
        .btn-info { background: linear-gradient(180deg, #00d2ff, #0081d4); color: #fff; box-shadow: 0 6px 0 #00568c, 0 0 20px rgba(0, 210, 255, 0.4); border: 1px solid #75e2ff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);}

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.3s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        
        .modal-box { background: rgba(16, 22, 36, 0.95); border: 2px solid var(--lab-cyan); padding: 40px; border-radius: 25px; text-align: center; max-width: 85%; width: 450px; transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 20px 60px rgba(0, 243, 255, 0.15), inset 0 0 40px rgba(0,0,0,0.6); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        
        .modal-title { font-size: 32px; font-family: var(--font-title); margin-top: 0; margin-bottom: 10px; color: var(--lab-acid); text-shadow: 0 0 15px rgba(57, 255, 20, 0.5);}
        .modal-formula { font-size: 50px; color: #fff; font-family: var(--font-title); margin-bottom: 25px; letter-spacing: 3px; text-shadow: 0 5px 15px rgba(0,0,0,0.6);}
        .modal-msg { font-size: 17px; margin-bottom: 25px; color: #bdc3c7; white-space: pre-line; line-height: 1.5; font-weight: bold;}
        
        .fact-box { background: rgba(0,0,0,0.4); border-left: 4px solid var(--lab-purple); padding: 15px; border-radius: 0 12px 12px 0; margin-bottom: 30px; text-align: left; display: flex; gap: 15px; align-items: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);}
        .fact-icon { font-size: 30px; }
        .fact-text { font-size: 14.5px; color: #aeb6bf; font-style: italic; margin: 0; line-height: 1.5;}

        .modal-btn { background: linear-gradient(180deg, #b339ff, #7800cc); box-shadow: 0 6px 0 #4c0080, 0 0 25px rgba(179, 57, 255, 0.4); padding: 15px 35px; font-size: 18px; color: white; border: 1px solid #d9a0ff; border-radius: 12px; font-family: var(--font-title); font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;}
        .modal-btn:active { transform: translateY(6px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="lab-background">
        <div class="tube tube-1"></div>
        <div class="tube tube-2"></div>
        <div class="tube tube-3"></div>
        <div id="bg-bubbles"></div>
    </div>

    <!-- UI SUPERIOR -->
    <div class="top-ui-container">
        <div class="header-row">
            <h1><span style="font-size: 32px;">👨‍🔬</span> Lanzador Iónico</h1>
            <div class="level-badge" id="level-indicator">Nivel 1/30</div>
        </div>
        
        <div class="difficulty-selector">
            <button id="btn-diff-easy" class="diff-btn active" onclick="setDifficulty('easy')">Fácil</button>
            <button id="btn-diff-medium" class="diff-btn" onclick="setDifficulty('medium')">Medio</button>
            <button id="btn-diff-hard" class="diff-btn" onclick="setDifficulty('hard')">Difícil</button>
        </div>

        <div class="prompt-box">
            <div class="compound-info">
                <span class="compound-label">Objetivo de síntesis:</span>
                <span class="compound-name" id="target-compound">Cargando...</span>
            </div>
            <div class="progress-tracker">
                <span>Requeridos</span>
                <span id="atoms-left">0</span>
            </div>
        </div>
    </div>

    <!-- ÁREA DE JUEGO -->
    <div class="canvas-container" id="canvasWrap">
        <canvas id="gameCanvas" width="900" height="450"></canvas>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <button class="btn btn-reset" onclick="resetShot()">🔄 Abortar Tiro</button>
        <button class="btn btn-info" onclick="showHelp()">💡 Ayuda del Doc</button>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="m-title">Título</h2>
            <div class="modal-formula" id="m-formula"></div>
            <p class="modal-msg" id="m-msg">Mensaje</p>
            <div class="fact-box" id="fact-container" style="display: none;">
                <span class="fact-icon">💡</span>
                <p class="fact-text" id="m-fact">Dato curioso aquí.</p>
            </div>
            <button class="modal-btn" onclick="nextLevelAction()" id="m-btn">Siguiente Nivel</button>
        </div>
    </div>

    <script>
        // GENERADOR DE BURBUJAS CSS
        const bubbleContainer = document.getElementById('bg-bubbles');
        for(let i=0; i<15; i++) {
            let b = document.createElement('div');
            b.className = 'bubble-bg';
            let size = Math.random() * 12 + 6;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + 'vw';
            b.style.animationDuration = (Math.random() * 6 + 4) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            bubbleContainer.appendChild(b);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.getElementById('canvasWrap');

        // AUDIO
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) { audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); } }
        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // Físicas Generales
        const gravity = 0.25;
        const friction = 0.98;
        const groundY = 390; 

        // Estado del Juego
        let isDragging = false;
        let isFlying = false;
        let currentLevel = 0;
        let particles = [];
        let bumpers = []; 
        let targets = [];
        let trail = [];
        let floatTexts = [];
        let requiredCollected = 0;
        let time = 0; 

        // Bobina Tesla
        const sling = { x: 120, y: 290, r: 90 }; 

        // Proyectil
        let bird = { x: 120, y: 290, r: 22, vx: 0, vy: 0, text: "", color: "#00f3ff", active: true, successfulHit: false };

        // CLASES DE EFECTOS
        class Particle {
            constructor(x, y, color, isSuccess) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * (isSuccess ? 12 : 18);
                this.vy = (Math.random() - 0.5) * (isSuccess ? 12 : 18);
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 8 + 4;
                this.gravity = isSuccess ? 0.05 : 0.2;
            }
            update() { 
                this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy; 
                this.life -= 0.025; 
                this.size *= 0.95; 
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class FloatText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.life = 1.0; this.vy = -1.5;
            }
            update() { this.y += this.vy; this.life -= 0.015; }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.font = "bold 28px Fredoka";
                ctx.textAlign = "center";
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
            }
        }

        class Bumper {
            constructor(x, y, r) { this.x = x; this.y = y; this.r = r; }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                let grad = ctx.createRadialGradient(this.x - this.r/3, this.y - this.r/3, this.r/5, this.x, this.y, this.r);
                grad.addColorStop(0, "#fff"); grad.addColorStop(0.3, "#7f8c8d"); grad.addColorStop(1, "#1e272c");
                ctx.fillStyle = grad; ctx.fill();

                ctx.strokeStyle = "rgba(0, 243, 255, 0.5)"; ctx.lineWidth = 2; ctx.stroke();

                ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.4 + Math.sin(time*5)*2, 0, Math.PI*2);
                ctx.fillStyle = varColor('--lab-acid');
                ctx.shadowBlur = 15; ctx.shadowColor = varColor('--lab-acid');
                ctx.fill(); ctx.shadowBlur = 0;
            }
        }

        const allLevels = [
            { diff: "easy", name: "Monóxido de carbono", form: "CO", base: "C", baseCol: "#95a5a6", reqA: "O", reqCount: 1, reqCol: "#e74c3c", wrongA: ["N"], fact: "Es un gas muy peligroso que sale del escape de los autos." },
            { diff: "easy", name: "Cloruro de sodio", form: "NaCl", base: "Na", baseCol: "#f1c40f", reqA: "Cl", reqCount: 1, reqCol: "#2ecc71", wrongA: ["He"], fact: "¡Es la sal de mesa que usamos todos los días en la comida!" },
            { diff: "easy", name: "Óxido de magnesio", form: "MgO", base: "Mg", baseCol: "#bdc3c7", reqA: "O", reqCount: 1, reqCol: "#e74c3c", wrongA: ["F"], fact: "Se usa en las medicinas antiácidas para el dolor de estómago." },
            { diff: "easy", name: "Fluoruro de hidrógeno", form: "HF", base: "H", baseCol: "#3498db", reqA: "F", reqCount: 1, reqCol: "#1abc9c", wrongA: ["S"], fact: "Es tan corrosivo que puede disolver el vidrio." },
            { diff: "easy", name: "Bromuro de potasio", form: "KBr", base: "K", baseCol: "#9b59b6", reqA: "Br", reqCount: 1, reqCol: "#d35400", wrongA: ["C"], fact: "En el siglo XIX, los médicos lo usaban como un sedante." },
            { diff: "easy", name: "Sulfuro de zinc", form: "ZnS", base: "Zn", baseCol: "#7f8c8d", reqA: "S", reqCount: 1, reqCol: "#f1c40f", wrongA: ["O"], fact: "Brilla en la oscuridad y se usa en pinturas fosforescentes." },
            { diff: "easy", name: "Óxido de calcio", form: "CaO", base: "Ca", baseCol: "#ecf0f1", reqA: "O", reqCount: 1, reqCol: "#e74c3c", wrongA: ["Cl"], fact: "Se le llama 'cal viva' y es fundamental en la construcción." },
            { diff: "easy", name: "Yoduro de plata", form: "AgI", base: "Ag", baseCol: "#bdc3c7", reqA: "I", reqCount: 1, reqCol: "#8e44ad", wrongA: ["H"], fact: "Se usa para 'sembrar nubes' y provocar lluvia artificial." },
            { diff: "easy", name: "Cloruro de hidrógeno", form: "HCl", base: "H", baseCol: "#3498db", reqA: "Cl", reqCount: 1, reqCol: "#2ecc71", wrongA: ["N"], fact: "Mezclado con agua, forma el ácido que disuelve tu comida en el estómago." },
            { diff: "easy", name: "Monóxido de nitrógeno", form: "NO", base: "N", baseCol: "#8e44ad", reqA: "O", reqCount: 1, reqCol: "#e74c3c", wrongA: ["C"], fact: "A pesar de ser un gas tóxico, tu propio cuerpo lo produce para la circulación." },
            
            { diff: "medium", name: "Monóxido de dihidrógeno", form: "H₂O", base: "O", baseCol: "#e74c3c", reqA: "H", reqCount: 2, reqCol: "#3498db", wrongA: ["C", "Na"], fact: "¡Es el agua! Cubre el 71% de la superficie de nuestro planeta Tierra." },
            { diff: "medium", name: "Dióxido de carbono", form: "CO₂", base: "C", baseCol: "#95a5a6", reqA: "O", reqCount: 2, reqCol: "#e74c3c", wrongA: ["H", "N"], fact: "Es el gas que exhalamos y que las plantas necesitan para respirar." },
            { diff: "medium", name: "Tetrahidruro de carbono", form: "CH₄", base: "C", baseCol: "#95a5a6", reqA: "H", reqCount: 4, reqCol: "#3498db", wrongA: ["O", "Cl"], fact: "Conocido como metano, es el gas inflamable que usas en la cocina." },
            { diff: "medium", name: "Trihidruro de nitrógeno", form: "NH₃", base: "N", baseCol: "#8e44ad", reqA: "H", reqCount: 3, reqCol: "#3498db", wrongA: ["S", "O"], fact: "Es el amoníaco, un gas de olor muy fuerte usado en productos de limpieza." },
            { diff: "medium", name: "Dióxido de azufre", form: "SO₂", base: "S", baseCol: "#f1c40f", reqA: "O", reqCount: 2, reqCol: "#e74c3c", wrongA: ["C", "F"], fact: "Se produce en las erupciones volcánicas y es el causante de la lluvia ácida." },
            { diff: "medium", name: "Dicloruro de calcio", form: "CaCl₂", base: "Ca", baseCol: "#ecf0f1", reqA: "Cl", reqCount: 2, reqCol: "#2ecc71", wrongA: ["Na", "H"], fact: "En países fríos se arroja en las calles para derretir la nieve y el hielo." },
            { diff: "medium", name: "Dicloruro de magnesio", form: "MgCl₂", base: "Mg", baseCol: "#bdc3c7", reqA: "Cl", reqCount: 2, reqCol: "#2ecc71", wrongA: ["O", "Br"], fact: "Es un mineral vital para los músculos que encuentras en el tofu y las almendras." },
            { diff: "medium", name: "Trifluoruro de boro", form: "BF₃", base: "B", baseCol: "#e67e22", reqA: "F", reqCount: 3, reqCol: "#1abc9c", wrongA: ["C", "N"], fact: "Es un gas incoloro y tóxico que se usa como catalizador para hacer plásticos." },
            { diff: "medium", name: "Disulfuro de carbono", form: "CS₂", base: "C", baseCol: "#95a5a6", reqA: "S", reqCount: 2, reqCol: "#f1c40f", wrongA: ["O", "Cl"], fact: "Es un líquido inflamable que huele terriblemente mal y se usa para hacer celofán." },
            { diff: "medium", name: "Dióxido de nitrógeno", form: "NO₂", base: "N", baseCol: "#8e44ad", reqA: "O", reqCount: 2, reqCol: "#e74c3c", wrongA: ["H", "C"], fact: "Es un gas tóxico de color marrón rojizo, principal culpable del smog en las ciudades." },
            
            { diff: "hard", name: "Trióxido de dihierro", form: "Fe₂O₃", base: "Fe₂", baseCol: "#d35400", reqA: "O", reqCount: 3, reqCol: "#e74c3c", wrongA: ["C", "N", "Cl", "S"], fact: "Es el óxido común. Le da el color rojo al planeta Marte y a tu sangre." },
            { diff: "hard", name: "Tricloruro de aluminio", form: "AlCl₃", base: "Al", baseCol: "#bdc3c7", reqA: "Cl", reqCount: 3, reqCol: "#2ecc71", wrongA: ["H", "O", "Na", "F"], fact: "Es el ingrediente activo principal que utilizan los desodorantes antitranspirantes." },
            { diff: "hard", name: "Hexafluoruro de azufre", form: "SF₆", base: "S", baseCol: "#f1c40f", reqA: "F", reqCount: 6, reqCol: "#1abc9c", wrongA: ["C", "O", "N", "H"], fact: "Es un gas tan pesado que si lo respiras (no lo hagas), tu voz suena súper grave." },
            { diff: "hard", name: "Tetracloruro de carbono", form: "CCl₄", base: "C", baseCol: "#95a5a6", reqA: "Cl", reqCount: 4, reqCol: "#2ecc71", wrongA: ["O", "H", "F", "Br"], fact: "Antes se usaba en extintores de incendios, pero se prohibió porque era muy tóxico." },
            { diff: "hard", name: "Dióxido de silicio", form: "SiO₂", base: "Si", baseCol: "#7f8c8d", reqA: "O", reqCount: 2, reqCol: "#e74c3c", wrongA: ["C", "N", "S", "Cl"], fact: "Es el componente principal de la arena de la playa y el ingrediente para hacer vidrio." },
            { diff: "hard", name: "Trióxido de azufre", form: "SO₃", base: "S", baseCol: "#f1c40f", reqA: "O", reqCount: 3, reqCol: "#e74c3c", wrongA: ["H", "C", "N", "Cl"], fact: "Cuando este gas contaminante se mezcla con agua en las nubes, forma ácido sulfúrico." },
            { diff: "hard", name: "Pentacloruro de fósforo", form: "PCl₅", base: "P", baseCol: "#e67e22", reqA: "Cl", reqCount: 5, reqCol: "#2ecc71", wrongA: ["O", "F", "N", "Na"], fact: "Es un sólido cristalino amarillo que reacciona violentamente si toca el agua." },
            { diff: "hard", name: "Hexafluoruro de uranio", form: "UF₆", base: "U", baseCol: "#27ae60", reqA: "F", reqCount: 6, reqCol: "#1abc9c", wrongA: ["C", "O", "S", "Cl"], fact: "Se usa en las plantas de energía nuclear para enriquecer el uranio combustible." },
            { diff: "hard", name: "Tetrabromuro de carbono", form: "CBr₄", base: "C", baseCol: "#95a5a6", reqA: "Br", reqCount: 4, reqCol: "#d35400", wrongA: ["O", "H", "N", "Cl"], fact: "Es un compuesto que se usaba antiguamente para vulcanizar el caucho de las llantas." },
            { diff: "hard", name: "Pentóxido de dinitrógeno", form: "N₂O₅", base: "N₂", baseCol: "#8e44ad", reqA: "O", reqCount: 5, reqCol: "#e74c3c", wrongA: ["C", "H", "S", "Cl"], fact: "Es un sólido blanco inestable que se utiliza en la fabricación de explosivos modernos." }
        ];

        const colorMap = { "N":"#8e44ad", "C":"#95a5a6", "O":"#e74c3c", "H":"#3498db", "He":"#9b59b6", "F":"#1abc9c", "S":"#f1c40f", "Cl":"#2ecc71", "Br":"#d35400", "Na":"#f1c40f" };

        function drawChemicalText(ctx, text, x, y) {
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            let hasNum = text.match(/[0-9₂₃₄₅₆₇₈]/);
            if (!hasNum) { ctx.fillText(text, x, y); return; }
            let letter = text.replace(/[0-9₂₃₄₅₆₇₈]/g, '');
            let num = text.match(/[0-9₂₃₄₅₆₇₈]/)[0];
            const subMap = {'₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8'};
            if(subMap[num]) num = subMap[num];
            ctx.font = "bold 20px Nunito"; ctx.fillText(letter, x - 5, y);
            ctx.font = "bold 12px Nunito"; ctx.fillText(num, x + 8, y + 8);
            ctx.font = "bold 18px Nunito";
        }

        function buildBumpers(difficulty) {
            bumpers = [];
            let count = difficulty === 'easy' ? 1 : (difficulty === 'medium' ? 2 : 3);
            let fixedRadius = 35; 
            let maxAttempts = 100;

            for(let i = 0; i < count; i++) {
                let placed = false; let attempts = 0;
                while (!placed && attempts < maxAttempts) {
                    let x = 350 + Math.random() * 450; 
                    let y = 100 + Math.random() * (groundY - 150 - fixedRadius);
                    let overlap = false;
                    for (let b of bumpers) {
                        let dx = x - b.x; let dy = y - b.y;
                        if (Math.sqrt(dx*dx + dy*dy) < (fixedRadius + b.r + 20)) { overlap = true; break; }
                    }
                    if (!overlap) { bumpers.push(new Bumper(x, y, fixedRadius)); placed = true; }
                    attempts++;
                }
            }
        }

        function spawnTarget(text, isCorrect) {
            let angle = Math.random() * Math.PI * 2;
            let uniformSpeed = Math.random() * 1.5 + 1.5; 
            return {
                text: text, color: colorMap[text] || "#7f8c8d", isCorrect: isCorrect,
                r: 25, x: 400 + Math.random() * 400, y: 50 + Math.random() * 250,
                vx: Math.cos(angle) * uniformSpeed, vy: Math.sin(angle) * uniformSpeed, hit: false
            };
        }

        function setDifficulty(diff) {
            if (isFlying && bird.active) return; 
            if (diff === 'easy') currentLevel = 0;
            else if (diff === 'medium') currentLevel = 10;
            else if (diff === 'hard') currentLevel = 20;
            loadLevel(currentLevel);
        }

        function updateDifficultyUI(index) {
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            if (index < 10) document.getElementById('btn-diff-easy').classList.add('active');
            else if (index < 20) document.getElementById('btn-diff-medium').classList.add('active');
            else document.getElementById('btn-diff-hard').classList.add('active');
        }

        function loadLevel(index) {
            if(index >= allLevels.length) {
                showModal("¡Maestro Químico! 🏆", "", "Has completado todos los compuestos del laboratorio.", "Volver a Jugar", null, () => {
                    currentLevel = 0; loadLevel(0); closeModal();
                });
                return;
            }

            const lvl = allLevels[index];
            updateDifficultyUI(index);

            document.getElementById('level-indicator').innerText = `Nivel ${index + 1}/30`;
            document.getElementById('target-compound').innerText = lvl.name;
            requiredCollected = 0;
            
            bird.text = lvl.base; bird.color = lvl.baseCol;
            document.getElementById('atoms-left').innerText = lvl.reqCount;

            let maxTargets = 2;
            if(lvl.diff === "medium") maxTargets = 3; 
            if(lvl.diff === "hard") maxTargets = 5; 

            targets = [];
            targets.push(spawnTarget(lvl.reqA, true));
            for(let i=0; i<maxTargets-1; i++) {
                let wAtom = lvl.wrongA[i % lvl.wrongA.length];
                targets.push(spawnTarget(wAtom, false));
            }

            buildBumpers(lvl.diff);
            resetShot();
        }

        function resetShot() {
            bird.x = sling.x; bird.y = sling.y; bird.vx = 0; bird.vy = 0;
            isFlying = false; isDragging = false; bird.active = true; bird.successfulHit = false; 
            trail = [];
        }

        function createExplosion(x, y, color, isSuccess) {
            for(let i=0; i<35; i++) particles.push(new Particle(x, y, color, isSuccess));
        }
        
        function triggerShake() {
            canvasWrap.classList.remove('shake');
            void canvasWrap.offsetWidth; 
            canvasWrap.classList.add('shake');
        }

        function circleCollision(obj, staticBumper, bounceFactor = 0.8) {
            let dx = obj.x - staticBumper.x; let dy = obj.y - staticBumper.y;
            let dist = Math.sqrt(dx*dx + dy*dy); let minDist = obj.r + staticBumper.r;

            if (dist < minDist) {
                let overlap = minDist - dist; let nx = dx / dist; let ny = dy / dist;
                obj.x += nx * overlap; obj.y += ny * overlap;
                let dp = obj.vx * nx + obj.vy * ny;
                if (dp < 0) { obj.vx -= (1 + bounceFactor) * dp * nx; obj.vy -= (1 + bounceFactor) * dp * ny; }
                return true;
            }
            return false;
        }

        function handleCollisions() {
            if(!bird.active) return;

            if (bird.y + bird.r >= groundY) { bird.y = groundY - bird.r; bird.vy *= -0.6; bird.vx *= friction; if(Math.abs(bird.vy) < 1) bird.vy = 0; }
            if (bird.x + bird.r >= canvas.width) { bird.x = canvas.width - bird.r; bird.vx *= -0.8; }
            if (bird.x - bird.r <= 0) { bird.x = bird.r; bird.vx *= -0.8; }
            if (bird.y - bird.r <= 0) { bird.y = bird.r; bird.vy *= -0.8; }

            bumpers.forEach(b => {
                if(circleCollision(bird, b, 0.7)) {
                    playTone(200, 'square', 0.1, 0.1);
                    createExplosion(bird.x + (b.x - bird.x)/2, bird.y + (b.y - bird.y)/2, varColor('--lab-cyan'), false); 
                }
            });

            let hitList = targets.filter(t => !t.hit && Math.sqrt((bird.x - t.x)**2 + (bird.y - t.y)**2) < bird.r + t.r);
            hitList.sort((a, b) => (a.isCorrect === b.isCorrect) ? 0 : a.isCorrect ? -1 : 1);

            for (let t of hitList) {
                t.hit = true;
                let lvl = allLevels[currentLevel];

                if (t.isCorrect) {
                    bird.successfulHit = true; 
                    playTone(880, 'sine', 0.15, 0.2); setTimeout(()=> playTone(1174, 'sine', 0.2, 0.2), 100);
                    createExplosion(t.x, t.y, varColor('--lab-acid'), true);
                    floatTexts.push(new FloatText(t.x, t.y - 20, "+1", varColor('--lab-acid')));
                    
                    requiredCollected++;
                    let left = lvl.reqCount - requiredCollected;
                    
                    if (left > 0) {
                        document.getElementById('atoms-left').innerText = left;
                        setTimeout(() => { targets.push(spawnTarget(lvl.reqA, true)); }, 500);
                    } else {
                        isFlying = false; bird.active = false;
                        document.getElementById('atoms-left').innerText = `¡LISTO!`;
                        setTimeout(() => {
                            playTone(523, 'square', 0.2, 0.1); setTimeout(()=>playTone(659, 'square', 0.2, 0.1), 150); setTimeout(()=>playTone(1046, 'square', 0.4, 0.1), 300);
                            showModal("¡Reacción Exitosa! ✨", lvl.form, `Has sintetizado ${lvl.name}.`, "Siguiente Nivel", lvl.fact, () => {
                                currentLevel++; loadLevel(currentLevel); closeModal();
                            });
                        }, 600);
                    }
                } else {
                    if (bird.successfulHit) {
                        createExplosion(t.x, t.y, '#7f8c8d', false);
                    } else {
                        isFlying = false; bird.active = false;
                        playTone(150, 'sawtooth', 0.4, 0.3);
                        triggerShake();
                        createExplosion(t.x, t.y, '#e74c3c', false);
                        setTimeout(() => {
                            showModal("¡BOOM! Reacción Inestable 💥", "", `Atrapaste un elemento equivocado.\nConcéntrate en buscar el átomo correcto.`, "Reintentar", null, () => {
                                loadLevel(currentLevel); closeModal();
                            });
                        }, 700);
                    }
                }
            }

            if (isFlying && Math.abs(bird.vx) < 0.1 && Math.abs(bird.vy) < 0.1 && bird.y >= groundY - bird.r - 2) {
                isFlying = false; setTimeout(resetShot, 800);
            }
        }

        function updateTargets() {
            targets = targets.filter(t => !t.hit);
            targets.forEach(t => {
                t.x += t.vx; t.y += t.vy;
                if (t.x + t.r > canvas.width) { t.x = canvas.width - t.r; t.vx *= -1; }
                else if (t.x - t.r < 250) { t.x = 250 + t.r; t.vx *= -1; }
                if (t.y + t.r > groundY) { t.y = groundY - t.r; t.vy *= -1; }
                else if (t.y - t.r < 0) { t.y = t.r; t.vy *= -1; }
                bumpers.forEach(b => circleCollision(t, b, 1.0));
            });
        }

        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#fff'; }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            time += 0.05;

            // OLA DE ÁCIDO DINÁMICA (Doble capa de senoides para efecto hirviendo)
            let acidGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            acidGrad.addColorStop(0, "rgba(57, 255, 20, 0.4)");
            acidGrad.addColorStop(1, "rgba(18, 128, 0, 0.8)");
            ctx.fillStyle = acidGrad; ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Ola de atrás (más oscura y lenta)
            ctx.beginPath(); ctx.moveTo(0, groundY);
            for(let i=0; i<=canvas.width; i+=20) { ctx.lineTo(i, groundY + Math.cos(i*0.03 + time*1.5) * 6); }
            ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
            ctx.fillStyle = "rgba(18, 128, 0, 0.6)"; ctx.fill();

            // Ola del frente (brillante y rápida)
            ctx.beginPath(); ctx.moveTo(0, groundY);
            for(let i=0; i<=canvas.width; i+=20) { ctx.lineTo(i, groundY + Math.sin(i*0.04 + time*2.5) * 8); }
            ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
            ctx.fillStyle = "rgba(57, 255, 20, 0.25)"; ctx.fill();
            ctx.strokeStyle = varColor('--lab-acid'); ctx.lineWidth = 3; ctx.stroke();

            // BOBINA TESLA Y LÁSER
            ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(sling.x - 15, sling.y, 30, groundY - sling.y); 
            ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(sling.x - 25, groundY - 20, 50, 20); 
            
            ctx.beginPath(); ctx.arc(sling.x, sling.y, 14, 0, Math.PI*2);
            ctx.fillStyle = varColor('--lab-cyan'); ctx.fill();
            ctx.shadowBlur = 20; ctx.shadowColor = varColor('--lab-cyan');
            
            if (bird.active && !isFlying) {
                // Rayo láser dinámico hacia el proyectil
                ctx.beginPath(); ctx.moveTo(sling.x, sling.y); ctx.lineTo(bird.x, bird.y); 
                ctx.strokeStyle = `rgba(0, 243, 255, ${0.5 + Math.sin(time*10)*0.3})`; ctx.lineWidth = 4; ctx.stroke();
                
                // Línea de trayectoria predictiva
                if (isDragging) {
                    ctx.shadowBlur = 0; 
                    ctx.beginPath(); ctx.setLineDash([8, 12]); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0, 243, 255, 0.4)"; 
                    let simX = bird.x; let simY = bird.y; let simVx = (sling.x - bird.x) * 0.2; let simVy = (sling.y - bird.y) * 0.2;
                    ctx.moveTo(simX, simY);
                    for (let i = 0; i < 35; i++) { simVy += gravity; simX += simVx; simY += simVy; ctx.lineTo(simX, simY); }
                    ctx.stroke(); ctx.setLineDash([]); 
                }
            }
            ctx.shadowBlur = 0; 

            // OBSTÁCULOS
            bumpers.forEach(b => { b.draw(ctx); });

            // DRONES (BLANCOS)
            ctx.font = "bold 20px Nunito";
            targets.forEach(t => {
                if (!t.hit) {
                    ctx.save(); ctx.translate(t.x, t.y); let angle = Math.atan2(t.vy, t.vx); ctx.rotate(angle); 
                    ctx.fillStyle = "rgba(0, 255, 255, 0.4)"; ctx.beginPath();
                    ctx.moveTo(-t.r + 5, -10); ctx.lineTo(-t.r + 5, 10); ctx.lineTo(-t.r - 15 - Math.random() * 15, 0); ctx.fill();
                    ctx.restore();

                    let grad = ctx.createRadialGradient(t.x-8, t.y-8, 3, t.x, t.y, t.r);
                    grad.addColorStop(0, "#fff"); grad.addColorStop(1, t.color);
                    ctx.shadowBlur = 15; ctx.shadowColor = t.color;
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(time * 2); 
                    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.ellipse(0, 0, t.r + 8, t.r - 10, 0, 0, Math.PI*2); ctx.stroke();
                    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(t.r + 8, 0, 3, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                    ctx.fillStyle = "#fff"; ctx.shadowBlur = 5; ctx.shadowColor = "#000"; 
                    drawChemicalText(ctx, t.text, t.x, t.y); ctx.shadowBlur = 0;
                }
            });

            // RASTRO (TRAIL) DEL PROYECTIL
            if(trail.length > 0) {
                for(let i=0; i<trail.length; i++) {
                    ctx.globalAlpha = trail[i].alpha * 0.5;
                    ctx.fillStyle = bird.color;
                    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, bird.r * trail[i].alpha, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }

            // PROYECTIL PRINCIPAL
            if (bird.active) {
                if (!isFlying && !isDragging) bird.y = sling.y + Math.sin(time * 4) * 6;
                
                let bGrad = ctx.createRadialGradient(bird.x-8, bird.y-8, 3, bird.x, bird.y, bird.r);
                bGrad.addColorStop(0, "#fff"); bGrad.addColorStop(1, bird.color);

                ctx.shadowBlur = 20; ctx.shadowColor = bird.color;
                ctx.fillStyle = bGrad; ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(-time * 3); 
                ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.ellipse(0, 0, bird.r + 8, bird.r - 10, 0, 0, Math.PI*2); ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(bird.r + 8, 0, 3, 0, Math.PI*2); ctx.fill();
                ctx.restore();

                ctx.fillStyle = "#fff"; ctx.shadowBlur = 5; ctx.shadowColor = "#000";
                ctx.font = "bold 18px Nunito"; drawChemicalText(ctx, bird.text, bird.x, bird.y); ctx.shadowBlur = 0;
            }

            // EFECTOS (Partículas y Textos Flotantes)
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw(ctx);
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            
            for(let i = floatTexts.length - 1; i >= 0; i--) {
                floatTexts[i].update(); floatTexts[i].draw(ctx);
                if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }
        }

        function update() {
            if (isFlying && bird.active) { 
                bird.vy += gravity; bird.x += bird.vx; bird.y += bird.vy; 
                trail.push({x: bird.x, y: bird.y, alpha: 1.0});
                if(trail.length > 15) trail.shift();
            }
            trail.forEach(t => t.alpha -= 0.08);
            trail = trail.filter(t => t.alpha > 0);

            handleCollisions(); updateTargets(); draw(); requestAnimationFrame(update);
        }

        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX; let clientY = evt.clientY;
            if(evt.touches && evt.touches.length > 0) { clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY; }
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }
        function down(e) {
            if (isFlying || !bird.active) return;
            const pos = getPos(e); let dx = pos.x - bird.x; let dy = pos.y - bird.y;
            if (Math.sqrt(dx*dx + dy*dy) < bird.r + 25) { isDragging = true; initAudio(); playTone(400, 'sine', 0.1, 0.1); if(e.cancelable) e.preventDefault(); }
        }
        function move(e) {
            if (!isDragging || !bird.active) return;
            if(e.cancelable) e.preventDefault();
            const pos = getPos(e); let dx = pos.x - sling.x; let dy = pos.y - sling.y;
            let angle = Math.atan2(dy, dx); let dist = Math.min(Math.sqrt(dx*dx + dy*dy), sling.r);
            if (Math.cos(angle) > 0.2) angle = Math.acos(0.2) * Math.sign(Math.asin(Math.sin(angle)));
            bird.x = sling.x + Math.cos(angle) * dist; bird.y = sling.y + Math.sin(angle) * dist;
        }
        function up(e) {
            if (isDragging) {
                isDragging = false; let dx = sling.x - bird.x; let dy = sling.y - bird.y;
                if (Math.sqrt(dx*dx + dy*dy) > 10) { bird.vx = dx * 0.2; bird.vy = dy * 0.2; isFlying = true; playTone(300, 'triangle', 0.2, 0.1); } 
                else { resetShot(); }
            }
        }

        canvas.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        canvas.addEventListener('touchstart', down, {passive:false}); window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', up);

        let nextAction = null;
        function showModal(title, formula, msg, btnText, fact, action) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-formula').innerText = formula;
            document.getElementById('m-msg').innerText = msg;
            document.getElementById('m-btn').innerText = btnText;
            if(fact) { document.getElementById('fact-container').style.display = "flex"; document.getElementById('m-fact').innerText = fact; } 
            else { document.getElementById('fact-container').style.display = "none"; }
            nextAction = action; document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); initAudio(); playTone(600, 'sine', 0.1, 0.1); }
        function showHelp() { initAudio(); playTone(600, 'sine', 0.1, 0.1); showModal("💡 Instrucciones del Doc", "", "1. Lee el compuesto a sintetizar arriba a la derecha.\n2. Deduce la fórmula química (ej. Agua = H₂O).\n3. Tienes el átomo base en el lanzador. ¡Apunta y dispara a los átomos correctos para atraparlos en el aire!", "¡Entendido!", null, closeModal); }
        function nextLevelAction() { initAudio(); playTone(600, 'sine', 0.1, 0.1); if(nextAction) nextAction(); }

        loadLevel(0); update();
    </script>
    <script>
        document.body.addEventListener('pointerdown', function() {
            let elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen().catch(e=>{});
