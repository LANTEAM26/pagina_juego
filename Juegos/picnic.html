<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Picnic en el Campo!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        margin: 0;
        font-family: 'Fredoka', sans-serif;
        background: linear-gradient(135deg, #4ea8de 0%, #48cae4 50%, #90e0ef 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        color: #2b2d42;
        padding: 10px;
    }

    .bg-decor {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
    }

    .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50px;
        animation: floatCloud 22s infinite linear;
    }

    @keyframes floatCloud {
        from { transform: translateX(-150px); }
        to { transform: translateX(calc(100vw + 150px)); }
    }

    header {
        text-align: center;
        margin-top: 5px;
        z-index: 10;
    }

    h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.8vw, 2.4rem);
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 3px 6px rgba(0,0,0,0.15);
        letter-spacing: 1px;
    }

    #instruction-box {
        background: #ffffff;
        border: 4px solid #ffb703;
        padding: 6px 30px;
        border-radius: 40px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        margin-top: 2px;
        z-index: 10;
        animation: pulseBox 2s infinite ease-in-out;
    }

    @keyframes pulseBox {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }

    #instruction {
        font-size: clamp(1.3rem, 2.2vw, 1.7rem);
        font-weight: 700;
        color: #f77f00;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    /* CONTENEDOR DE JUEGO / MANTEL DE PICNIC */
    #game {
        position: relative;
        width: min(780px, 95vw);
        height: 460px;
        background-color: #ff6b6b;
        background-image: 
            linear-gradient(45deg, #ff8787 25%, transparent 25%), 
            linear-gradient(-45deg, #ff8787 25%, transparent 25%), 
            linear-gradient(45deg, transparent 75%, #ff8787 75%), 
            linear-gradient(-45deg, transparent 75%, #ff8787 75%);
        background-size: 40px 40px;
        background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        background-color: #fa5252;
        
        border: 10px solid #ffffff;
        border-radius: 40px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        margin: 15px 0;
        overflow: visible; /* Permite que los animales sobresalgan del mantel */
    }

    /* SNACKS Y FRUTAS MÁS GRANDES Y CON BRILLO */
    .scattered-food {
        position: absolute;
        font-size: 36px;
        opacity: 0.9;
        pointer-events: none;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        z-index: 1;
        animation: shineFood 3s infinite alternate ease-in-out;
    }

    @keyframes shineFood {
        0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) drop-shadow(0 0 5px rgba(255, 255, 255, 0.5)); }
        100% { transform: scale(1.08) rotate(5deg); filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35)) drop-shadow(0 0 14px rgba(255, 255, 255, 0.95)); }
    }

    /* ANIMALES ENCIMA DEL MANTEL (COMO MARCO INTEGRADO) */
    .animal {
        position: absolute;
        width: 110px;
        height: 110px;
        z-index: 25; /* Muy por encima del mantel y la comida */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .animal-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        border: 5px solid #ffffff;
        background: #fff;
    }

    .face {
        font-size: 46px;
        transition: transform 0.2s ease;
    }

    /* Colores limpios y armónicos */
    #animalTop .animal-avatar { background: radial-gradient(circle, #ffe3e3, #ff8787); }
    #animalBottom .animal-avatar { background: radial-gradient(circle, #d8f3dc, #52b788); }
    #animalLeft .animal-avatar { background: radial-gradient(circle, #e9ecef, #adb5bd); }
    #animalRight .animal-avatar { background: radial-gradient(circle, #ffecd2, #fcb69f); }

    .animal span {
        font-size: 11px;
        font-weight: 700;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.6);
        padding: 2px 10px;
        border-radius: 12px;
        margin-top: 4px;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ANIMACIÓN DE COMER */
    .animal.eating {
        animation: jumpAndChew 0.6s infinite ease-in-out;
    }

    @keyframes jumpAndChew {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.15) rotate(4deg); }
    }

    .animal.eating .face {
        animation: faceChewing 0.2s infinite alternate ease-in-out;
    }

    @keyframes faceChewing {
        0% { transform: scale(1) translateY(0); }
        100% { transform: scale(1.25) translateY(-3px); }
    }

    .animal.eating .animal-avatar {
        box-shadow: 0 0 35px #ffb703;
        border-color: #ffb703;
    }

    /* POSICIONAMIENTO EXACTO EN EL BORDE (MARCO SUPERIOR DEL MANTEL) */
    #animalTop { left: calc(50% - 55px); top: -48px; }
    #animalBottom { left: calc(50% - 55px); bottom: -48px; }
    #animalLeft { left: -48px; top: calc(50% - 55px); }
    #animalRight { right: -48px; top: calc(50% - 55px); }

    /* COMIDA PRINCIPAL QUE SE ARRASTRA */
    #food {
        position: absolute;
        left: calc(50% - 35px);
        top: calc(50% - 35px);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        z-index: 20;
        touch-action: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        transition: left 0.3s ease, top 0.3s ease, transform 0.2s;
    }

    #food-icon {
        font-size: 38px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    #food:active {
        cursor: grabbing;
        transform: scale(1.2);
    }

    #start-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(43, 45, 66, 0.92);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        transition: opacity 0.4s ease;
        border-radius: 30px;
    }

    #start-screen h2 {
        font-size: 2.6rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
        text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-align: center;
    }

    #start-screen p {
        font-size: 1.15rem;
        color: #edf2f4;
        margin-bottom: 25px;
        text-align: center;
        max-width: 380px;
        font-weight: 400;
    }

    .btn-main {
        padding: 16px 45px;
        border: none;
        border-radius: 40px;
        background: #ffb703;
        color: #2b2d42;
        font-family: 'Fredoka', sans-serif;
        font-size: 22px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        transition: all 0.2s ease;
    }

    .btn-main:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        background: #fb8500;
        color: #ffffff;
    }

    #message {
        font-size: 19px;
        font-weight: 700;
        min-height: 26px;
        text-align: center;
        z-index: 10;
        text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .correct {
        color: #ffffff;
    }

    .wrong {
        color: #ffe3e3;
    }

    .panel-bottom {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-bottom: 5px;
        z-index: 10;
    }

    #score {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border: 3px solid #ffffff;
        padding: 8px 22px;
        border-radius: 25px;
        font-size: 17px;
        font-weight: 700;
        color: #2b2d42;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    #points {
        color: #f77f00;
        font-size: 20px;
    }

    .btn-action {
        padding: 10px 24px;
        border: none;
        border-radius: 20px;
        background: #ffffff;
        color: #2b2d42;
        font-family: 'Fredoka', sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transition: all 0.2s ease;
    }

    .btn-action:hover {
        transform: translateY(-2px);
        background: #f8fafc;
        box-shadow: 0 8px 20px rgba(0,0,test,0.15);
    }

    .btn-action:active {
        transform: translateY(1px);
    }
</style>
</head>

<body>

<div class="bg-decor">
    <div class="cloud" style="width: 120px; height: 45px; top: 15%; animation-duration: 20s; animation-delay: 0s;"></div>
    <div class="cloud" style="width: 80px; height: 30px; top: 35%; animation-duration: 14s; animation-delay: -5s;"></div>
</div>

<header>
    <h1>🧺 ¡PICNIC EN EL CAMPO! 🌿</h1>
</header>

<div id="instruction-box">
    <div id="instruction">LISTO PARA JUGAR</div>
</div>

<div id="game">
    <!-- Frutas y snacks más grandes y con destello luminoso repartidos estratégicamente -->
    <div class="scattered-food" style="top: 18%; left: 12%; animation-delay: 0s;">🍇</div>
    <div class="scattered-food" style="top: 75%; left: 15%; animation-delay: 1s;">🧀</div>
    <div class="scattered-food" style="top: 22%; left: 80%; animation-delay: 0.5s;">🍎</div>
    <div class="scattered-food" style="top: 72%; left: 82%; animation-delay: 1.5s;">🍉</div>
    <div class="scattered-food" style="top: 48%; left: 8%; animation-delay: 0.8s;">🍪</div>
    <div class="scattered-food" style="top: 45%; left: 88%; animation-delay: 1.2s;">🍓</div>
    <div class="scattered-food" style="top: 12%; left: 46%; animation-delay: 0.3s;">🍐</div>
    <div class="scattered-food" style="top: 80%; left: 48%; animation-delay: 2s;">🥪</div>

    <div id="start-screen">
        <h2>¡Hora del Picnic!</h2>
        <p>Lleva la comida correcta hacia la dirección que te indique la voz.</p>
        <button class="btn-main" onclick="startGame()">▶ ¡A COMER!</button>
    </div>

    <!-- Animales situados exactamente como marco encima del mantel -->
    <div id="animalTop" class="animal">
        <div class="animal-avatar"><div class="face">🐵</div></div>
        <span>ARRIBA</span>
    </div>

    <div id="animalBottom" class="animal">
        <div class="animal-avatar"><div class="face">🐰</div></div>
        <span>ABAJO</span>
    </div>

    <div id="animalLeft" class="animal">
        <div class="animal-avatar"><div class="face">🐱</div></div>
        <span>IZQUIERDA</span>
    </div>

    <div id="animalRight" class="animal">
        <div class="animal-avatar"><div class="face">🐶</div></div>
        <span>DERECHA</span>
    </div>

    <div id="food">
        <div id="food-icon">🍌</div>
    </div>
</div>

<div id="message"></div>

<div class="panel-bottom">
    <div id="score">Puntos: <span id="points">0</span></div>
    <button class="btn-action" onclick="startGame()">▶ Iniciar</button>
    <button class="btn-action" onclick="resetGame()">🔄 Reiniciar</button>
</div>


<script>
const food = document.getElementById("food");
const foodIcon = document.getElementById("food-icon");
const instruction = document.getElementById("instruction");
const message = document.getElementById("message");
const pointsText = document.getElementById("points");
const startScreen = document.getElementById("start-screen");

let gameStarted = false;
let dragging = false;
let offsetX = 0;
let offsetY = 0;
let currentDirection = "";
let points = 0;

const itemsData = [
    { direction: "ARRIBA", animalId: "animalTop", food: "🍌", color: "#ffb703" },
    { direction: "ABAJO", animalId: "animalBottom", food: "🥕", color: "#fb8500" },
    { direction: "IZQUIERDA", animalId: "animalLeft", food: "🐟", color: "#219ebc" },
    { direction: "DERECHA", animalId: "animalRight", food: "🦴", color: "#ffafcc" }
];

let currentItem = null;
let queueDirections = [];
let repeatState = 0; 

function getNextRandomItem() {
    if (queueDirections.length === 0) {
        let pool = [...itemsData];
        pool.sort(() => Math.random() - 0.5);
        queueDirections = pool;
    }
    return queueDirections.pop();
}

function startGame() {
    gameStarted = true;
    startScreen.style.opacity = "0";
    setTimeout(() => {
        startScreen.style.display = "none";
        newRound();
    }, 400);
}

function resetGame() {
    points = 0;
    pointsText.textContent = points;
    queueDirections = [];
    repeatState = 0;
    gameStarted = true;
    startScreen.style.display = "none";
    startScreen.style.opacity = "1";
    newRound();
}

function returnFoodToCenter() {
    food.style.transition = "left 0.3s ease, top 0.3s ease";
    food.style.left = "calc(50% - 35px)";
    food.style.top = "calc(50% - 35px)";
    setTimeout(() => {
        food.style.transition = "none";
    }, 300);
}

function newRound() {
    returnFoodToCenter();
    message.textContent = "";

    document.querySelectorAll('.animal').forEach(el => {
        el.classList.remove('eating');
        const face = el.querySelector('.face');
        if(face.dataset.original) face.textContent = face.dataset.original;
    });
    food.style.display = "flex";

    if (repeatState === 0) {
        currentItem = getNextRandomItem();
    } else if (repeatState === 2) {
        repeatState = 0;
    }

    currentDirection = currentItem.direction;
    foodIcon.textContent = currentItem.food;

    food.style.border = `4px solid ${currentItem.color}`;
    food.style.boxShadow = `0 10px 25px rgba(0,0,0,0.2), 0 0 15px ${currentItem.color}`;

    instruction.textContent = currentDirection;
    speak(currentDirection);
}

function speak(text) {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const voice = new SpeechSynthesisUtterance(text);
        voice.lang = "es-ES";
        voice.rate = 0.85;
        voice.pitch = 1.2;
        speechSynthesis.speak(voice);
    }
}

food.addEventListener("mousedown", startDrag);
food.addEventListener("touchstart", startDrag, {passive: false});

function startDrag(e) {
    if (!gameStarted) return;
    dragging = true;
    const rect = food.getBoundingClientRect();
    const clientX = e.clientX || e.touches[0].clientX;
    const clientY = e.clientY || e.touches[0].clientY;

    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
}

document.addEventListener("mousemove", moveFood);
document.addEventListener("touchmove", moveFood, {passive: false});

function moveFood(e) {
    if (!dragging || !gameStarted) return;
    e.preventDefault();

    const clientX = e.clientX || e.touches[0].clientX;
    const clientY = e.clientY || e.touches[0].clientY;
    const gameRect = document.getElementById("game").getBoundingClientRect();

    food.style.left = (clientX - gameRect.left - offsetX) + "px";
    food.style.top = (clientY - gameRect.top - offsetY) + "px";
}

document.addEventListener("mouseup", stopDrag);
document.addEventListener("touchend", stopDrag);

function stopDrag() {
    if (!dragging || !gameStarted) return;
    dragging = false;
    checkAnswer();
}

function checkAnswer() {
    const foodRect = food.getBoundingClientRect();
    const gameRect = document.getElementById("game").getBoundingClientRect();

    const foodX = foodRect.left + foodRect.width / 2;
    const foodY = foodRect.top + foodRect.height / 2;
    const centerX = gameRect.left + gameRect.width / 2;
    const centerY = gameRect.top + gameRect.height / 2;

    let direction;
    const dx = foodX - centerX;
    const dy = foodY - centerY;

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 70) direction = "DERECHA";
        else if (dx < -70) direction = "IZQUIERDA";
    } else {
        if (dy > 70) direction = "ABAJO";
        else if (dy < -70) direction = "ARRIBA";
    }

    if (!direction) {
        message.textContent = "¡Arrastra hacia un animal!";
        message.className = "wrong";
        food.style.border = "4px solid #ff4d4d";
        food.style.boxShadow = "0 0 20px #ff4d4d";
        
        repeatState = 1; 
        returnFoodToCenter();
        return;
    }

    if (direction === currentDirection) {
        correctAnswer();
    } else {
        wrongAnswer();
    }
}

function correctAnswer() {
    points++;
    pointsText.textContent = points;
    message.textContent = "¡DELICIOSO!";
    message.className = "correct";
    speak("¡Muy bien!");

    if (repeatState === 1) {
        repeatState = 2;
    } else {
        repeatState = 0;
    }

    const activeAnimal = document.getElementById(currentItem.animalId);
    activeAnimal.classList.add('eating');
    
    const face = activeAnimal.querySelector('.face');
    if(!face.dataset.original) face.dataset.original = face.textContent;
    face.textContent = "😋";

    food.style.display = "none";

    setTimeout(() => {
        newRound();
    }, 1400);
}

function wrongAnswer() {
    message.textContent = "¡INTÉNTALO OTRA VEZ!";
    message.className = "wrong";
    speak("Inténtalo otra vez");
    
    food.style.border = "4px solid #ff4d4d";
    food.style.boxShadow = "0 0 20px #ff4d4d";

    repeatState = 1; 
    returnFoodToCenter();
}
</script>

</body>
</html>
