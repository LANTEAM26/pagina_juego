<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro Arcade - Crea y Reproduce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

        :root {
            --bg-deep: #1a1040;
            --bg-card: #241b4d;
            --accent-cyan: #00e5ff;
            --accent-pink: #ff2d95;
            --accent-yellow: #ffd93d;
            --accent-green: #3dff8b;
            --accent-purple: #b14aff;
            --accent-orange: #ff8c42;
            --text-light: #f0eaff;
            --text-dim: #9b8ec4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at 20% 20%, #2a1a5e 0%, var(--bg-deep) 50%, #0d0722 100%);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,.4), transparent),
                radial-gradient(2px 2px at 75% 15%, rgba(255,255,255,.3), transparent),
                radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,.5), transparent),
                radial-gradient(2px 2px at 88% 78%, rgba(255,255,255,.3), transparent),
                radial-gradient(1px 1px at 30% 88%, rgba(255,255,255,.4), transparent),
                radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,.2), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .arcade-cabinet {
            width: min(1020px, 100%);
            background: linear-gradient(160deg, #2e2366 0%, var(--bg-card) 40%, #1a1240 100%);
            border: 3px solid transparent;
            border-radius: 28px;
            padding: 26px;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 0 3px rgba(0,229,255,.3),
                0 0 40px rgba(0,229,255,.15),
                0 20px 60px rgba(0,0,0,.6),
                inset 0 1px 0 rgba(255,255,255,.1);
        }

        .arcade-cabinet::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink), var(--accent-yellow), var(--accent-green), var(--accent-cyan));
            background-size: 400% 400%;
            z-index: -1;
            animation: borderFlow 6s ease infinite;
            opacity: .7;
        }

        @keyframes borderFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(0,229,255,.25);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            background: linear-gradient(135deg, var(--accent-purple), #7a1fd6);
            color: #fff;
            text-decoration: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: .5px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,.3);
            box-shadow: 0 4px 0 #5a15a8, 0 6px 14px rgba(177,74,255,.3);
            transition: all .15s ease;
        }

        .btn-volver:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-volver:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #5a15a8;
        }

        .title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(18px, 2.4vw, 26px);
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink), var(--accent-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 8px rgba(255,45,149,.3));
        }

        .stats-bar {
            background: rgba(0,0,0,.4);
            padding: 8px 18px;
            border: 1.5px solid var(--accent-green);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: .5px;
            box-shadow: 0 0 12px rgba(61,255,139,.2);
        }

        /* LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        @media (max-width: 820px) {
            .main-grid { grid-template-columns: 1fr; }
            .arcade-cabinet { padding: 18px; border-radius: 22px; }
        }

        /* TARJETA DEL CRONÓMETRO */
        .timer-card {
            background: linear-gradient(170deg, #2d2260, #1c1445);
            border: 2px solid rgba(255,45,149,.5);
            border-radius: 22px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.3);
        }

        .timer-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,45,149,.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .panel-label {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            opacity: .9;
        }

        .timer-display {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(48px, 6vw, 68px);
            color: #fff;
            text-shadow: 
                0 0 20px rgba(0,229,255,.6),
                0 0 40px rgba(0,229,255,.3),
                0 4px 0 rgba(0,229,255,.3);
            letter-spacing: 3px;
            line-height: 1;
            padding: 8px 0;
            transition: color .2s, text-shadow .2s;
        }

        .timer-display.warning {
            color: var(--accent-yellow);
            text-shadow: 
                0 0 20px rgba(255,217,61,.8),
                0 0 40px rgba(255,217,61,.4);
            animation: pulseWarn .6s ease-in-out infinite alternate;
        }

        .timer-display.danger {
            color: var(--accent-pink);
            text-shadow: 
                0 0 20px rgba(255,45,149,.8),
                0 0 40px rgba(255,45,149,.4);
            animation: pulseWarn .4s ease-in-out infinite alternate;
        }

        @keyframes pulseWarn {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-input {
            width: 62px;
            background: rgba(0,0,0,.5);
            border: 2px solid rgba(0,229,255,.4);
            color: #fff;
            padding: 10px 6px;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 900;
            border-radius: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .time-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(0,229,255,.15);
        }

        .time-input::-webkit-inner-spin-button { opacity: .3; }

        .input-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
        }

        /* TARJETA MULTIMODO */
        .multimode-card {
            background: linear-gradient(170deg, #2d2260, #1c1445);
            border: 2px solid rgba(0,229,255,.4);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.3);
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 18px;
            background: rgba(0,0,0,.25);
            padding: 5px;
            border-radius: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: .5px;
            cursor: pointer;
            border-radius: 12px;
            transition: all .25s ease;
        }

        .tab-btn:hover { color: var(--text-light); background: rgba(255,255,255,.05); }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
            color: #0a0814;
            box-shadow: 0 4px 14px rgba(0,229,255,.4);
        }

        /* VISTA DIBUJO */
        .view-draw {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn .3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(12, 24px);
            grid-template-rows: repeat(12, 24px);
            gap: 2px;
            background: rgba(0,0,0,.4);
            border: 3px solid rgba(0,229,255,.5);
            padding: 6px;
            border-radius: 14px;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0,229,255,.15);
        }

        .pixel-cell {
            width: 24px;
            height: 24px;
            background: #0a0814;
            border-radius: 3px;
            transition: transform .1s;
        }

        .pixel-cell:hover { transform: scale(1.15); z-index: 2; }

        .palette {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all .2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,.4);
        }

        .swatch:hover { transform: translateY(-3px) scale(1.1); }

        .swatch.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 16px currentColor, 0 4px 10px rgba(0,0,0,.4);
        }

        /* VISTA REPRODUCCIÓN */
        .view-play {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 340px;
            background: radial-gradient(circle at center, #1a0f3a 0%, #000 100%);
            border: 3px solid var(--accent-green);
            border-radius: 18px;
            box-shadow: inset 0 0 40px rgba(61,255,139,.12), 0 0 24px rgba(61,255,139,.15);
            padding: 24px;
            gap: 18px;
            animation: fadeIn .3s ease;
        }

        .arcade-screen-canvas {
            width: 200px;
            height: 200px;
            image-rendering: pixelated;
            border: 4px solid var(--accent-yellow);
            border-radius: 12px;
            box-shadow: 
                0 0 20px rgba(255,217,61,.4),
                0 0 60px rgba(255,217,61,.15),
                inset 0 0 20px rgba(0,0,0,.5);
            background: #050505;
        }

        .play-status {
            font-size: 15px;
            font-weight: 900;
            color: var(--accent-green);
            text-align: center;
            letter-spacing: .5px;
            text-shadow: 0 0 12px rgba(61,255,139,.5);
        }

        .frame-indicator {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 700;
        }

        /* BOTONES */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: .5px;
            padding: 12px 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all .15s ease;
            background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
            color: #0a0814;
            box-shadow: 0 5px 0 #006699, 0 6px 16px rgba(0,229,255,.25);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #006699;
        }

        .btn-play {
            background: linear-gradient(135deg, var(--accent-green), #00cc66);
            color: #052210;
            box-shadow: 0 5px 0 #009944, 0 6px 16px rgba(61,255,139,.3);
        }

        .btn-pause {
            background: linear-gradient(135deg, var(--accent-yellow), #e6b800);
            color: #3a2e00;
            box-shadow: 0 5px 0 #b38f00, 0 6px 16px rgba(255,217,61,.25);
        }

        .btn-reset {
            background: linear-gradient(135deg, var(--accent-pink), #cc0066);
            color: #fff;
            box-shadow: 0 5px 0 #99004d, 0 6px 16px rgba(255,45,149,.3);
        }

        .btn-purple {
            background: linear-gradient(135deg, var(--accent-purple), #7a1fd6);
            color: #fff;
            box-shadow: 0 5px 0 #5a15a8, 0 6px 16px rgba(177,74,255,.3);
        }

        .btn-sound {
            background: linear-gradient(135deg, var(--accent-orange), #e6732e);
            color: #fff;
            box-shadow: 0 5px 0 #b35219, 0 6px 16px rgba(255,140,66,.3);
        }

        .btn-sound.mudo {
            background: linear-gradient(135deg, #555, #333);
            color: #aaa;
            box-shadow: 0 5px 0 #222, 0 6px 16px rgba(0,0,0,.3);
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .pixel-grid {
                grid-template-columns: repeat(12, 18px);
                grid-template-rows: repeat(12, 18px);
            }
            .pixel-cell { width: 18px; height: 18px; }
            .arcade-screen-canvas { width: 150px; height: 150px; }
            .swatch { width: 28px; height: 28px; }
            .btn { padding: 10px 16px; font-size: 11px; }
            .timer-display { font-size: 44px; }
        }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="btn-volver">← Volver al menú</a>
            <h1 class="title">🎮 CRONÓMETRO ARCADE</h1>
        </div>
        <div class="stats-bar">
            ESTADO: <span id="sysStatus" style="color:var(--accent-yellow);">EDICIÓN</span> &nbsp;|&nbsp; FRAME: <span id="frameNum">1</span>/<span id="totalFrames">3</span>
        </div>
    </div>

    <div class="main-grid">
        <!-- CRONÓMETRO -->
        <div class="timer-card">
            <div class="panel-label">⚡ Panel de Control</div>
            
            <div id="timerDisplay" class="timer-display">00:00</div>

            <div class="timer-inputs">
                <span class="input-label">MIN</span>
                <input type="number" id="minInput" class="time-input" value="0" min="0">
                <span class="input-label">SEG</span>
                <input type="number" id="segInput" class="time-input" value="0" min="0" max="59">
            </div>

            <div class="btn-group">
                <button class="btn btn-play" onclick="startTimer()">▶ PLAY</button>
                <button class="btn btn-pause" onclick="pauseTimer()">⏸ PAUSA</button>
                <button class="btn btn-reset" onclick="resetTimer()">🔄 RESET</button>
            </div>

            <button id="sonidoBtn" class="btn btn-sound" onclick="toggleSonido()">🔊 SONIDO ON</button>
        </div>

        <!-- MULTIMODO -->
        <div class="multimode-card">
            <div class="mode-tabs">
                <button id="tabDraw" class="tab-btn active" onclick="switchMode('draw')">✏️ DIBUJAR SPRITE</button>
                <button id="tabPlay" class="tab-btn" onclick="switchMode('play')">📺 PANTALLA ARCADE</button>
            </div>

            <!-- DIBUJO -->
            <div id="viewDraw" class="view-draw">
                <div id="pixelGrid" class="pixel-grid"></div>

                <div class="palette">
                    <div class="swatch active" style="background:#000000; color:#000000;" data-color="#000000"></div>
                    <div class="swatch" style="background:#ffffff; color:#ffffff;" data-color="#ffffff"></div>
                    <div class="swatch" style="background:#ff2d95; color:#ff2d95;" data-color="#ff2d95"></div>
                    <div class="swatch" style="background:#00e5ff; color:#00e5ff;" data-color="#00e5ff"></div>
                    <div class="swatch" style="background:#ffd93d; color:#ffd93d;" data-color="#ffd93d"></div>
                    <div class="swatch" style="background:#3dff8b; color:#3dff8b;" data-color="#3dff8b"></div>
                    <div class="swatch" style="background:#b14aff; color:#b14aff;" data-color="#b14aff"></div>
                    <div class="swatch" style="background:#ff8c42; color:#ff8c42;" data-color="#ff8c42"></div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-purple" onclick="saveFrame()">💾 GUARDAR FRAME</button>
                    <button class="btn btn-reset" onclick="clearCanvas()">🧹 LIMPIAR</button>
                </div>
            </div>

            <!-- REPRODUCCIÓN -->
            <div id="viewPlay" class="view-play">
                <canvas id="arcadeScreen" class="arcade-screen-canvas" width="12" height="12"></canvas>
                <div class="play-status" id="playStatusText">▶ REPRODUCIENDO ANIMACIÓN</div>
                <div class="frame-indicator">Frame <span id="frameNumPlay">1</span> de <span id="totalFramesPlay">3</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    const GRID_SIZE = 12;
    let currentColor = '#ffffff';
    let isMouseDown = false;
    let pixelData = Array(GRID_SIZE * GRID_SIZE).fill('#000000');
    let frames = [];
    let currentFrame = 0;

    let timeRemaining = 0;
    let timerInterval = null;
    let isRunning = false;
    let sonidoActivado = true;

    const timerDisplay = document.getElementById('timerDisplay');
    const arcadeScreen = document.getElementById('arcadeScreen');
    const ctx = arcadeScreen.getContext('2d');
    const sonidoBtn = document.getElementById('sonidoBtn');

    /* =====================================================
       AUDIO — CONTEXTO CON COMPRESOR
    ===================================================== */
    let audioContext = null;
    let masterGain = null;
    let compresor = null;

    function iniciarAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            compresor = audioContext.createDynamicsCompressor();
            compresor.threshold.value = -10;
            compresor.knee.value = 6;
            compresor.ratio.value = 12;
            compresor.attack.value = 0.003;
            compresor.release.value = 0.25;

            masterGain = audioContext.createGain();
            masterGain.gain.value = 1.0;

            compresor.connect(masterGain);
            masterGain.connect(audioContext.destination);
        }
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
    }

    /* Sonido de cuenta regresiva (últimos 10 segundos) */
    function sonidoCuenta() {
        if (!sonidoActivado) return;
        iniciarAudio();

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(880, audioContext.currentTime);

        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioContext.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.18);

        oscillator.connect(gain);
        gain.connect(compresor);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.2);
    }

    /* =====================================================
       🎵 SONIDO FINAL — MELODÍA ALEGRE ASCENDENTE
       (Diferente al anterior: campanitas + fanfarria)
    ===================================================== */
    function sonidoFinal() {
        iniciarAudio();
        const ahora = audioContext.currentTime;

        /* --- MELODÍA PRINCIPAL: DO-MI-SOL-DO (arpegio ascendente) --- */
        const melodia = [
            { freq: 523.25, t: 0.0 },   // Do5
            { freq: 659.25, t: 0.15 },  // Mi5
            { freq: 783.99, t: 0.30 },  // Sol5
            { freq: 1046.50, t: 0.45 }, // Do6
            { freq: 1318.51, t: 0.65 }, // Mi6
            { freq: 1567.98, t: 0.85 }  // Sol6
        ];

        melodia.forEach(({ freq, t }) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;

            const start = ahora + t;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.5, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);

            osc.connect(gain);
            gain.connect(compresor);
            osc.start(start);
            osc.stop(start + 0.4);
        });

        /* --- CAMPANITAS BRILLANTES (segunda voz) --- */
        const campanas = [
            { freq: 2093.00, t: 0.5 },
            { freq: 2637.02, t: 0.7 },
            { freq: 3135.96, t: 0.9 }
        ];

        campanas.forEach(({ freq, t }) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "triangle";
            osc.frequency.value = freq;

            const start = ahora + t;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.35, start + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);

            osc.connect(gain);
            gain.connect(compresor);
            osc.start(start);
            osc.stop(start + 0.65);
        });

        /* --- PAD DE FONDO CÁLIDO (acorde sostenido) --- */
        const acorde = [261.63, 329.63, 392.00]; // Do, Mi, Sol
        acorde.forEach(freq => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.0001, ahora);
            gain.gain.linearRampToValueAtTime(0.15, ahora + 0.3);
            gain.gain.setValueAtTime(0.15, ahora + 1.5);
            gain.gain.exponentialRampToValueAtTime(0.0001, ahora + 2.5);

            osc.connect(gain);
            gain.connect(compresor);
            osc.start(ahora);
            osc.stop(ahora + 2.6);
        });

        /* --- DESTELLO FINAL (whoosh) --- */
        const bufferSize = audioContext.sampleRate * 0.4;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            const decay = Math.pow(1 - i / bufferSize, 3);
            data[i] = (Math.random() * 2 - 1) * decay;
        }
        const ruido = audioContext.createBufferSource();
        ruido.buffer = buffer;
        const filtro = audioContext.createBiquadFilter();
        filtro.type = "highpass";
        filtro.frequency.setValueAtTime(2000, ahora);
        filtro.frequency.exponentialRampToValueAtTime(8000, ahora + 0.4);
        const ruidoGain = audioContext.createGain();
        ruidoGain.gain.setValueAtTime(0.3, ahora);
        ruidoGain.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.4);
        ruido.connect(filtro);
        filtro.connect(ruidoGain);
        ruidoGain.connect(compresor);
        ruido.start(ahora + 1.0);
        ruido.stop(ahora + 1.4);

        /* --- BAJO SUAVE (ancla armónica) --- */
        const bajoOsc = audioContext.createOscillator();
        const bajoGain = audioContext.createGain();
        bajoOsc.type = "sine";
        bajoOsc.frequency.value = 130.81; // Do3
        bajoGain.gain.setValueAtTime(0.0001, ahora);
        bajoGain.gain.linearRampToValueAtTime(0.4, ahora + 0.1);
        bajoGain.gain.setValueAtTime(0.4, ahora + 1.2);
        bajoGain.gain.exponentialRampToValueAtTime(0.0001, ahora + 2.2);
        bajoOsc.connect(bajoGain);
        bajoGain.connect(compresor);
        bajoOsc.start(ahora);
        bajoOsc.stop(ahora + 2.3);
    }

    /* =====================================================
       GRID DE DIBUJO
    ===================================================== */
    function initGrid() {
        const grid = document.getElementById('pixelGrid');
        grid.innerHTML = '';
        for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
            const cell = document.createElement('div');
            cell.className = 'pixel-cell';
            cell.addEventListener('mousedown', (e) => { e.preventDefault(); isMouseDown = true; paint(i); });
            cell.addEventListener('mouseenter', () => { if(isMouseDown) paint(i); });
            grid.appendChild(cell);
        }
        document.addEventListener('mouseup', () => isMouseDown = false);
        createDefaultFrames();
    }

    function paint(i) {
        pixelData[i] = currentColor;
        document.getElementById('pixelGrid').children[i].style.background = currentColor;
    }

    document.querySelectorAll('.swatch').forEach(sw => {
        sw.addEventListener('click', () => {
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
            currentColor = sw.dataset.color;
        });
    });

    function switchMode(mode) {
        const viewDraw = document.getElementById('viewDraw');
        const viewPlay = document.getElementById('viewPlay');
        const tabDraw = document.getElementById('tabDraw');
        const tabPlay = document.getElementById('tabPlay');
        const sysStatus = document.getElementById('sysStatus');

        if (mode === 'draw') {
            viewDraw.style.display = 'flex';
            viewPlay.style.display = 'none';
            tabDraw.classList.add('active');
            tabPlay.classList.remove('active');
            sysStatus.textContent = "EDICIÓN";
            sysStatus.style.color = "var(--accent-yellow)";
        } else {
            viewDraw.style.display = 'none';
            viewPlay.style.display = 'flex';
            tabDraw.classList.remove('active');
            tabPlay.classList.add('active');
            sysStatus.textContent = "EN PANTALLA";
            sysStatus.style.color = "var(--accent-green)";
            renderArcadeScreen();
            document.getElementById('totalFramesPlay').textContent = frames.length;
        }
    }

    function renderArcadeScreen() {
        if (frames.length === 0) return;
        let activeData = frames[currentFrame];
        ctx.clearRect(0, 0, 12, 12);
        for (let i = 0; i < activeData.length; i++) {
            ctx.fillStyle = activeData[i];
            ctx.fillRect(i % 12, Math.floor(i / 12), 1, 1);
        }
        document.getElementById('frameNumPlay').textContent = currentFrame + 1;
    }

    function saveFrame() {
        frames.push([...pixelData]);
        document.getElementById('totalFrames').textContent = frames.length;
        document.getElementById('totalFramesPlay').textContent = frames.length;
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '✅ ¡GUARDADO!';
        setTimeout(() => btn.textContent = originalText, 1200);
    }

    function clearCanvas() {
        pixelData.fill('#000000');
        Array.from(document.getElementById('pixelGrid').children).forEach(c => c.style.background = '#000000');
    }

    function formatTime(s) {
        let m = Math.floor(s / 60).toString().padStart(2, '0');
        let sec = (s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
    }

    function toggleSonido() {
        sonidoActivado = !sonidoActivado;
        if (sonidoActivado) {
            sonidoBtn.textContent = '🔊 SONIDO ON';
            sonidoBtn.classList.remove('mudo');
        } else {
            sonidoBtn.textContent = '🔇 SONIDO OFF';
            sonidoBtn.classList.add('mudo');
        }
    }

    function startTimer() {
        if (isRunning) return;

        if (timeRemaining <= 0) {
            let m = parseInt(document.getElementById('minInput').value) || 0;
            let s = parseInt(document.getElementById('segInput').value) || 0;
            timeRemaining = (m * 60) + s;
        }

        if (timeRemaining <= 0) {
            alert('⚠️ Programa un tiempo mayor a 0 segundos');
            return;
        }

        isRunning = true;
        switchMode('play');
        timerDisplay.classList.remove('warning', 'danger');
        document.getElementById('playStatusText').textContent = "▶ REPRODUCIENDO ANIMACIÓN";
        document.getElementById('playStatusText').style.color = "var(--accent-green)";

        timerInterval = setInterval(() => {
            timeRemaining--;
            timerDisplay.textContent = formatTime(timeRemaining);

            if (timeRemaining <= 10 && timeRemaining > 0) {
                sonidoCuenta();
                if (timeRemaining <= 5) {
                    timerDisplay.classList.remove('warning');
                    timerDisplay.classList.add('danger');
                } else {
                    timerDisplay.classList.add('warning');
                    timerDisplay.classList.remove('danger');
                }
            }

            if (frames.length > 0) {
                currentFrame = (currentFrame + 1) % frames.length;
                renderArcadeScreen();
                document.getElementById('frameNum').textContent = currentFrame + 1;
            }

            if (timeRemaining <= 0) {
                pauseTimer();
                timerDisplay.classList.remove('warning', 'danger');
                timerDisplay.textContent = "00:00";
                document.getElementById('playStatusText').textContent = "🏆 ¡TIEMPO FINALIZADO!";
                document.getElementById('playStatusText').style.color = "var(--accent-yellow)";
                sonidoFinal();
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
    }

    function resetTimer() {
        pauseTimer();
        timeRemaining = 0;
        timerDisplay.textContent = "00:00";
        timerDisplay.classList.remove('warning', 'danger');
        document.getElementById('playStatusText').textContent = "▶ REPRODUCIENDO ANIMACIÓN";
        document.getElementById('playStatusText').style.color = "var(--accent-green)";
    }

        f2[0] = cyan;

        /* ============================================

        const f3 = Array(144).fill('#000000');

        // Cabeza redonda (círculo aproximado)
        const cabeza = [

        frames = [f1, f2, f3];

    initGrid();
